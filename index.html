<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PR Desk</title>
<meta name="theme-color" content="#db2777">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PR Desk">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@800&display=swap" rel="stylesheet">
<script>
/* =========================================================
 *  PR Desk — ক্রিয়েটর, এজেন্সি, টিভি-পত্রিকার সাথে যোগাযোগ, চুক্তি, কিস্তি, কাজ জমা, নতুন খোঁজ
 *  API_URL = PR Desk-এর Apps Script ("Anyone" deployment) /exec লিংক।
 *  পেজ public — কোনো গোপন তথ্য নেই; নিরাপত্তা লগইন টোকেন + PIN থেকে।
 * ========================================================= */
var API_URL = 'https://script.google.com/macros/s/AKfycbz-eFPmsINRONgL5PkZHPvcUkTMDTer9fTqCCoHNsN-T-ahE8VN_4afqinI2DEHr-A/exec';

// github.io-র সব রিপোজিটরি একই storage ভাগ করতে পারে — তাই সব key-তে "prd_"
var AUTH_KEY = 'prd_auth', BOOT_KEY = 'prd_boot_v1';
var AUTH = '';
try { AUTH = localStorage.getItem(AUTH_KEY) || ''; } catch (e) {}
function setAuth(t) {
  AUTH = t || '';
  try { if (AUTH) localStorage.setItem(AUTH_KEY, AUTH); else { localStorage.removeItem(AUTH_KEY); localStorage.removeItem(BOOT_KEY); } } catch (e) {}
}

var THEME = 'auto';
try { THEME = localStorage.getItem('prd_theme') || 'auto'; } catch (e) {}
function applyTheme() {
  var t = THEME === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : THEME;
  document.documentElement.setAttribute('data-theme', t);
}
applyTheme();

var ORG = 'Technique Easy Education';
try { var _b = JSON.parse(localStorage.getItem(BOOT_KEY) || 'null'); if (_b && _b.data && _b.data.set) ORG = _b.data.set.org || ORG; } catch (e) {}

/* text/plain POST — preflight ছাড়াই সরাসরি Apps Script-এ; ৪০ সেকেন্ডে উত্তর না এলে বাতিল */
function callServer(fn, args) {
  var ctl = window.AbortController ? new AbortController() : null;
  var tm = ctl ? setTimeout(function () { ctl.abort(); }, 40000) : 0;
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fn, args: args || [], auth: AUTH }),
    signal: ctl ? ctl.signal : undefined
  }).then(function (r) {
    clearTimeout(tm);
    if (!r.ok) throw new Error('সার্ভার সাড়া দিচ্ছে না (' + r.status + ') — একটু পরে আবার চেষ্টা করুন।');
    return r.json().catch(function () { throw new Error('সার্ভারের উত্তর বোঝা যায়নি।'); });
  }, function () {
    clearTimeout(tm);
    throw new Error('সার্ভারে পৌঁছানো যায়নি — ইন্টারনেট সংযোগ দেখুন।');
  }).then(function (j) {
    if (!j || !j.ok) throw new Error((j && j.error) || 'অজানা সমস্যা।');
    return j.data;
  });
}

/* ব্যক্তিগত লোগো "Matra Logic" — Developed By-এর সামনে */
function markSvg(cls) {
  return '<svg class="mk ' + (cls || '') + '" viewBox="0 0 100 100" aria-hidden="true">' +
    '<path d="M8 18H92M16 88 40 18 64 88" fill="none" stroke="url(#mkg)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<path d="M84 18V88" fill="none" stroke="url(#mkg)" stroke-width="9" stroke-linecap="round"/>' +
    '<circle cx="40" cy="64" r="7.5" fill="url(#mkg)"/></svg>';
}
</script>
<style>
:root{
  --bg:#f6f3f7; --card:#ffffff; --ink:#1c1426; --ink2:#4b4058; --ink3:#8a7f97;
  --line:#ebe4ee; --soft:#f6f1f8; --shadow:0 1px 2px rgba(40,15,50,.05),0 8px 24px rgba(40,15,50,.06);
  --acc:#db2777; --acc-s:rgba(219,39,119,.11); --grad:linear-gradient(135deg,#f43f5e,#db2777 48%,#7c3aed);
  --pos:#15803d; --neg:#dc2626; --warn:#b45309; --info:#2563eb; --top:rgba(255,255,255,.86);
  --m1:#6366f1; --m2:#8b5cf6; --m3:#d946ef;
}
[data-theme=dark]{
  --bg:#110c17; --card:#1a1322; --ink:#f1eaf6; --ink2:#c4b7d0; --ink3:#8d7f9c;
  --line:#2c2238; --soft:#221a2c; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);
  --acc:#f472b6; --acc-s:rgba(244,114,182,.14); --pos:#4ade80; --neg:#f87171; --warn:#fbbf24; --info:#60a5fa; --top:rgba(22,15,30,.86);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:'Hind Siliguri','Inter','Nirmala UI',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;
  background:radial-gradient(900px 600px at -5% -10%,rgba(244,63,94,.13),transparent 62%),
             radial-gradient(800px 600px at 105% 0%,rgba(124,58,237,.12),transparent 60%),var(--bg);
  background-attachment:fixed}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.num{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
[hidden]{display:none!important}
a{color:var(--acc)}

/* ---------- লগইন ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
  background:radial-gradient(circle at 18% 14%,#be185d 0,transparent 45%),radial-gradient(circle at 86% 90%,#6d28d9 0,transparent 42%),#160b1d}
.lg-card{width:100%;max-width:370px;background:#fff;color:#1c1426;border-radius:24px;padding:30px 22px 20px;box-shadow:0 24px 60px rgba(0,0,0,.45);text-align:center}
.lg-card .ic{width:72px;height:72px;border-radius:20px;display:block;margin:0 auto 12px;box-shadow:0 10px 24px rgba(219,39,119,.3)}
.lg-card h1{font:800 22px 'Plus Jakarta Sans','Inter',sans-serif;letter-spacing:-.02em;margin-bottom:2px}
.lg-card .sub{font-size:13.5px;color:#7a6f88;margin-bottom:20px}
.lg-card label{display:block;text-align:left;font-size:13px;font-weight:700;color:#4b4058;margin:0 0 5px}
.lg-card input{width:100%;padding:13px 14px;border:2px solid #ebe1ef;border-radius:13px;font:600 16px 'Inter',sans-serif;outline:none;color:#1c1426;background:#fff}
.lg-card input:focus{border-color:#db2777;box-shadow:0 0 0 3px rgba(219,39,119,.15)}
.lg-card input.code{letter-spacing:8px;text-align:center;font-size:22px}
.lg-btn{width:100%;margin-top:12px;padding:14px;border:0;border-radius:13px;color:#fff;font-size:15.5px;font-weight:700;background:linear-gradient(135deg,#f43f5e,#db2777 48%,#7c3aed);box-shadow:0 8px 20px rgba(219,39,119,.35)}
.lg-btn:disabled{opacity:.6;cursor:wait}
.lg-msg{min-height:20px;margin-top:10px;font-size:13px;font-weight:600;color:#c0392b;line-height:1.5}
.lg-msg.ok{color:#2d6a4f}
.lg-link{background:none;border:0;color:#db2777;font-size:13px;font-weight:700;margin-top:8px}

/* ---------- কাঠামো ---------- */
.shell{min-height:100vh}
.side{display:none}
.topbar{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:var(--top);border-bottom:1px solid var(--line)}
.topbar-in{padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:11px;min-width:0;flex:1}
.brand img{width:40px;height:40px;border-radius:12px;flex:none;box-shadow:0 4px 12px rgba(219,39,119,.25)}
.brand b{display:block;font:800 17px 'Plus Jakarta Sans','Inter',sans-serif;letter-spacing:-.02em;line-height:1.2}
.brand small{display:block;font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{height:40px;min-width:40px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:15px;flex:none}
.ib:hover{border-color:var(--acc)}
.menu{position:absolute;right:16px;top:58px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;min-width:210px;z-index:30}
.menu button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;color:var(--ink);padding:11px 12px;border-radius:9px;font-size:14.5px;text-align:left}
.menu button:hover{background:var(--soft)}
main{padding:16px 16px 96px;max-width:1240px;margin:0 auto}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--top);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.bnav button{border:0;background:none;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px;border-radius:12px;font-size:11.5px;font-weight:600;position:relative;white-space:nowrap}
.bnav button i{font-style:normal;font-size:19px;line-height:1.2}
.bnav button.on{color:var(--acc);background:var(--acc-s)}
.nb{position:absolute;top:1px;right:calc(50% - 22px);min-width:17px;height:17px;border-radius:9px;background:var(--neg);color:#fff;font:700 10.5px/17px 'Inter',sans-serif;padding:0 4px}
.dev-foot{display:flex;align-items:center;justify-content:center;gap:7px;font-size:12px;color:var(--ink3);margin:26px 0 4px}
.dev-foot b{font:800 12.5px 'Plus Jakarta Sans','Inter',sans-serif;color:var(--ink2)}
.mk{width:18px;height:18px;flex:none}
@media(min-width:1000px){
  .shell{display:grid;grid-template-columns:250px 1fr}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:18px 14px;border-right:1px solid var(--line);background:var(--top);backdrop-filter:blur(14px)}
  .side .brand{flex:none;margin:0 4px 18px}
  .side .s-new{margin:0 4px 16px}
  .side nav{display:flex;flex-direction:column;gap:4px}
  .side nav button{display:flex;align-items:center;gap:11px;border:0;background:none;color:var(--ink2);padding:11px 12px;border-radius:12px;font-size:15px;font-weight:600;text-align:left;position:relative}
  .side nav button i{font-style:normal;font-size:18px;width:24px;text-align:center}
  .side nav button:hover{background:var(--soft)}
  .side nav button.on{background:var(--acc-s);color:var(--acc)}
  .side nav .nb{position:static;margin-left:auto}
  .side .s-tools{margin-top:auto;display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:12px}
  .side .s-tools button{border:0;background:none;color:var(--ink2);text-align:left;padding:8px 12px;border-radius:10px;font-size:13.5px}
  .side .s-tools button:hover{background:var(--soft)}
  .side .s-me{font-size:12px;color:var(--ink3);padding:4px 12px 8px;overflow-wrap:anywhere}
  .side .s-foot{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink3);padding:10px 12px 0}
  .side .s-foot b{font:800 12px 'Plus Jakarta Sans','Inter',sans-serif;color:var(--ink2)}
  .side .s-foot span{white-space:nowrap;font-size:11px}
  .topbar,.bnav,.dev-foot{display:none}
  main{padding:24px 28px 40px}
}

/* ---------- সাধারণ ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ph h2{font-size:22px;font-weight:700;line-height:1.25}
.ph p{font-size:13.5px;color:var(--ink3);margin-top:2px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h3{font-size:16px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card h3 small{font-size:12.5px;color:var(--ink3);font-weight:600}
.card .hint{font-size:13px;color:var(--ink3);line-height:1.55}
.card.warnc{border-color:color-mix(in srgb,var(--warn) 35%,var(--line))}
.card.badc{border-color:color-mix(in srgb,var(--neg) 35%,var(--line))}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 14px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(219,39,119,.25)}
.btn.ok{color:var(--pos);border-color:color-mix(in srgb,var(--pos) 35%,var(--line))}
.btn.red{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 35%,var(--line))}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.xs{padding:4px 8px;font-size:12.5px;border-radius:9px}
.btn.w{width:100%;justify-content:center}
.btn:disabled{opacity:.55;cursor:default}
.in,.sel{width:100%;min-width:0;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14.5px;outline:none}
.in:focus,.sel:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-s)}
textarea.in{resize:vertical;min-height:90px;line-height:1.55}
textarea.in.mono{font-family:'Inter',monospace;font-size:13px}
.fl{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin:12px 0 5px}
.fl em{font-style:normal;font-weight:500;color:var(--ink3)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
.seg{display:flex;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1 1 auto;border:0;background:none;color:var(--ink2);padding:8px 10px;border-radius:9px;font-size:13.5px;font-weight:600;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--acc);box-shadow:var(--shadow)}
.seg button em{font-style:normal;font:700 11.5px 'Inter',sans-serif;opacity:.7;margin-left:3px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink2);padding:7px 12px;border-radius:99px;font-size:13.5px;font-weight:600;white-space:nowrap;flex:none}
.tabs button em{font-style:normal;font:700 11.5px 'Inter',sans-serif;color:var(--ink3);margin-left:4px}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tabs button.on em{color:#fff;opacity:.85}
.sw{position:relative;width:44px;height:26px;border-radius:99px;background:var(--line);border:0;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.sw.on{background:var(--acc)} .sw.on::after{left:21px}
.swrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--soft);margin-top:8px}
.swrow span{flex:1;font-size:14px}
.swrow small{display:block;font-size:12px;color:var(--ink3)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--ink2);white-space:nowrap;border:0}
.chip b{font-family:'Inter',sans-serif}
.chip.acc{background:var(--acc-s);color:var(--acc)}
.chip.bad{background:color-mix(in srgb,var(--neg) 12%,transparent);color:var(--neg)}
.chip.ok{background:color-mix(in srgb,var(--pos) 13%,transparent);color:var(--pos)}
.chip.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.chip.info{background:color-mix(in srgb,var(--info) 12%,transparent);color:var(--info)}
button.chip{cursor:pointer}
.chip button{border:0;background:none;color:inherit;font-size:13px;padding:0 0 0 2px}
.stg{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.stg::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1c1426;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:92vw;text-align:center;display:flex;gap:10px;align-items:center;pointer-events:none}
.toast button{pointer-events:auto;background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;padding:5px 10px;font-weight:700;font-size:13px}
@media(min-width:1000px){.toast{bottom:28px}}
.sk{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--soft),var(--line),var(--soft));background-size:200% 100%;animation:sh 1.3s infinite;margin:10px 0}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:30px 16px;color:var(--ink3);font-size:14.5px;line-height:1.6}
.empty i{display:block;font-style:normal;font-size:34px;margin-bottom:6px}
.err{padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--neg) 9%,transparent);color:var(--neg);font-size:13.5px;line-height:1.5;margin-bottom:12px}
.note{padding:10px 12px;border-radius:12px;background:var(--soft);font-size:13px;color:var(--ink2);line-height:1.55;margin-top:10px}
.note.warn{background:color-mix(in srgb,var(--warn) 10%,transparent);color:var(--warn)}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;background:var(--grad)}
.bar.ok i{background:var(--pos)} .bar.bad i{background:var(--neg)}
.bar s{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink2);opacity:.55}
.more{display:block;width:100%;border:0;background:none;color:var(--acc);font-weight:700;font-size:13.5px;padding:10px 0 2px;text-align:center}

/* ---------- সারাংশ ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px;display:flex;gap:12px;align-items:center;min-width:0;text-align:left;color:var(--ink)}
button.stat:hover{border-color:var(--acc)}
.stat i{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-style:normal;font-size:19px;background:var(--acc-s);flex:none}
.stat small{display:block;font-size:12.5px;color:var(--ink3)}
.stat b{display:block;font:800 21px 'Inter',sans-serif;line-height:1.25}
.stat b em{font-style:normal;font-size:13px;color:var(--ink3);font-weight:600}
.stat.bad b{color:var(--neg)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.cols2>div>.card:last-child{margin-bottom:0}
.hello{display:flex;align-items:center;gap:14px;padding:18px;border-radius:20px;background:var(--grad);color:#fff;margin-bottom:14px;box-shadow:0 10px 30px rgba(219,39,119,.22)}
.hello b{display:block;font-size:20px;line-height:1.3}
.hello small{display:block;font-size:13.5px;opacity:.9}
.hello .grow{flex:1;min-width:0}
.hello .btn{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.25)}

/* ---------- সারি ---------- */
.rows{display:flex;flex-direction:column}
.r{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.r:first-child{border-top:0}
.r .grow{flex:1;min-width:0}
.r .grow b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

function dealSt(d) {
  var ks = S.KB[d.id] || [], ws = S.WB[d.id] || [], t = today();
  var o = { paid: 0, open: 0, unk: 0, planned: 0, over: 0, next: null, items: [], behind: 0, lagTot: 0 };
  ks.forEach(function (k) {
    var a = Number(k.amount) || 0; o.planned += a;
    if (k.st === 'paid') o.paid += payPaidAmt(k);
    else if (k.st === 'unk') o.unk += a;
    else { o.open += a; if (k.due && k.due < t) o.over++; if (!o.next) o.next = k; }
  });
  o.total = d.total || o.planned;
  var frac = null;
  if (d.start && d.end && d.end > d.start) frac = Math.max(0, Math.min(1, dd(d.start, t) / dd(d.start, d.end)));
  o.frac = frac;
  (d.items || []).forEach(function (it) {
    var got = (Number(it.base) || 0) + ws.filter(function (w) { return w.item === it.k; }).length;
    var exp = it.qty > 0 && frac != null ? Math.floor(it.qty * frac + 1e-9) : null;
    var lag = exp != null && d.status === 'active' ? Math.max(0, exp - got) : 0;
    if (lag > 0) { o.behind++; o.lagTot += lag; }
    o.items.push({ k: it.k, name: it.name, qty: it.qty, where: it.where, got: got, exp: exp, lag: lag });
  });
  o.ended = d.end && d.end < t;
  o.endIn = d.end ? dd(t, d.end) : null;
  o.missing = [];
  if (d.status === 'active') {
    if (!d.start || !d.end) o.missing.push('সময়কাল');
    if (!o.total) o.missing.push('মোট টাকা');
    if (!ks.length && o.total) o.missing.push('কিস্তির তালিকা');
    if (ks.some(function (k) { return payOpen(k) && !k.due; })) o.missing.push('কিস্তির তারিখ');
  }
  return o;
}

/* আজকের পাতার সব তালিকা — এক জায়গায় হিসাব */
function todayData() {
  var t = today(), set = S.set;
  var fu = S.partners.filter(function (p) { return p.next && p.next <= t && p.stage !== 'cancel'; }).sort(function (a, b) { return a.next < b.next ? -1 : 1; });
  var fuSoon = S.partners.filter(function (p) { return p.next && p.next > t && p.next <= addDays(t, 7) && p.stage !== 'cancel'; }).sort(function (a, b) { return a.next < b.next ? -1 : 1; });
  var pays = S.pays.filter(function (k) { return payLive(k) && (payOver(k) || paySoon(k)); }).sort(function (a, b) { return a.due < b.due ? -1 : 1; });
  var unk = S.pays.filter(function (k) { return k.st === 'unk' && payLive(k); }).sort(function (a, b) { return (a.due || '') < (b.due || '') ? -1 : 1; });
  var behind = [], ending = [], incomplete = [];
  S.deals.forEach(function (d) {
    if (d.status !== 'active') return;
    var st = dealSt(d);
    if (st.behind) behind.push({ d: d, st: st });
    if (d.end && st.endIn <= (+set.endWarn || 0)) ending.push({ d: d, st: st });
    if (st.missing.length) incomplete.push({ d: d, st: st });
  });
  ending.sort(function (a, b) { return a.d.end < b.d.end ? -1 : 1; });
  var noNext = S.partners.filter(function (p) { return OPEN_ST[p.stage] && !p.next; });
  var weekAgo = addDays(t, -6);
  var found = S.partners.filter(function (p) { return String(p.created || '').slice(0, 10) >= weekAgo; }).length;
  var upAmt = S.pays.filter(function (k) { return payLive(k) && payOpen(k) && k.due && k.due <= addDays(t, 30); }).reduce(function (s, k) { return s + (Number(k.amount) || 0); }, 0);
  var overN = S.pays.filter(function (k) { return payLive(k) && payOver(k); }).length;
  return { fu: fu, fuSoon: fuSoon, pays: pays, unk: unk, behind: behind, ending: ending, incomplete: incomplete, noNext: noNext, found: found, upAmt: upAmt, overN: overN };
}
function badgeCount() { var D = todayData(); return D.fu.length + D.pays.filter(payOver).length + D.pays.filter(function (k) { return k.due === today(); }).length; }

function applyBoot(d) {
  S.me = d.me; S.set = d.set || {}; S.today = d.today || ''; S.sync = d.sync || null;
  S.partners = d.partners || []; S.logs = d.logs || []; S.deals = d.deals || []; S.pays = d.pays || []; S.works = d.works || [];
  ORG = S.set.org || ORG;
  index();
  S.booted = true;
}
function saveBootCache() {
  try {
    localStorage.setItem(BOOT_KEY, JSON.stringify({ key: AUTH.slice(-16), data: { me: S.me, set: S.set, today: S.today, sync: S.sync,
      partners: S.partners, logs: S.logs, deals: S.deals, pays: S.pays, works: S.works } }));
  } catch (e) {}
}
function boot() {
  var cached = null;
  try { cached = JSON.parse(localStorage.getItem(BOOT_KEY) || 'null'); } catch (e) {}
  if (cached && cached.key === AUTH.slice(-16) && cached.data) { applyBoot(cached.data); route(); }
  else render();
  callServer('apiBoot', []).then(function (d) {
    applyBoot(d); saveBootCache(); S.bootErr = '';
    if (!$('ov')) route(); else renderShell();
  }, function (err) {
    if (/AUTH_REQUIRED/.test(err.message)) { logoutLocal(); return; }
    S.bootErr = err.message; if (!S.booted) render(); else toast('⚠️ ' + err.message);
  });
}
/* সার্ভারে কাজ — বোতাম ব্যস্ত দেখায়, ভুল হলে জানায়; সফল হলে ক্যাশ হালনাগাদ */
function api(fn, args, btn) {
  var lbl = btn ? btn.innerHTML : '';
  if (btn) { if (btn.disabled) return Promise.reject(new Error('busy')); btn.disabled = true; btn.innerHTML = '⏳ ' + (btn.dataset.busy || 'হচ্ছে…'); }
  return callServer(fn, args).then(function (d) {
    if (btn) { btn.disabled = false; btn.innerHTML = lbl; }
    setTimeout(saveBootCache, 0);
    return d;
  }, function (err) {
    if (btn) { btn.disabled = false; btn.innerHTML = lbl; }
    if (/AUTH_REQUIRED/.test(err.message)) { logoutLocal(); throw err; }
    if (!/^DUP:/.test(err.message)) toast('⚠️ ' + String(err.message).replace(/^(Exception|Error):\s*/, ''), 4500);
    throw err;
  });
}

function num(v) { var n = Number(String(v == null ? '' : v).replace(/[,\s৳]/g, '')); return isFinite(n) ? n : 0; }

function genPays() {

  var base = each || Math.floor(tot / n), rest = each ? 0 : tot - base * n;
  var ord = ['১ম', '২য়', '৩য়', '৪র্থ', '৫ম', '৬ষ্ঠ', '৭ম', '৮ম', '৯ম', '১০ম', '১১তম', '১২তম'];

  drawDealForm();
}

      if (!L.length) { toast('কিছু লেখা নেই।'); return; }
      api('apiQuickAdd', [L.map(function (x) { return qaPayload({ name: x.name, link: x.link, fol: x.fol, cat: x.cat || QA.cat || S.ff.cat, kind: 'creator' }); })], a).then(function (r) {
        r.added.forEach(function (p) { S.partners.push(p); }); index(); closeOv(); S.ff.tab = 'prospect'; rerender();
        toast('✅ ' + r.added.length + ' জন যোগ হয়েছে' + (r.skipped.length ? ' · ' + r.skipped.length + ' জন বাদ (আগেই আছে/নাম নেই)' : ''), 6000);
      });
      break;
    case 'ff-sel': S.ff.sel[id] = a.checked; $('ffList').innerHTML = findList(); return;
    case 'ff-clear': S.ff.sel = {}; $('ffList').innerHTML = findList(); break;
    case 'ff-stage':
      api('apiSetStage', [id, a.dataset.v], a).then(function (p) {
        upsert(S.partners, p); index(); rerender();
        toast(a.dataset.v === 'cancel' ? '✕ ' + p.name + ' বাদ' : '→ ' + p.name + ': ' + STG[p.stage].l, 5000, ['↩ ফেরান', function () { api('apiSetStage', [id, a.dataset.v === 'cancel' ? S.ff.tab : 'prospect']).then(function (q) { upsert(S.partners, q); index(); rerender(); }); }]);
      });
      break;
    case 'ff-bulk':
      var ids = Object.keys(S.ff.sel).filter(function (k) { return S.ff.sel[k]; });
      if (!ids.length) return;
      a.disabled = true; a.textContent = '⏳ ' + ids.length + ' জন…';
      ids.reduce(function (pr, pid) { return pr.then(function () { return callServer('apiSetStage', [pid, a.dataset.v]).then(function (p) { upsert(S.partners, p); }); }); }, Promise.resolve())
        .then(function () { index(); S.ff.sel = {}; saveBootCache(); rerender(); toast('✅ ' + ids.length + ' জন: ' + STG[a.dataset.v].l); },
              function (e) { index(); rerender(); toast('⚠️ ' + e.message); });
      break;

    case 'deal': dealView(id); break;
    case 'dealback': dealView(id); break;
    case 'deal-new':
      var pid0 = a.dataset.pid || (S.page === 'partner' ? S.pid : '');
      if (pid0) dealForm('', pid0); else pickPartner('📄 কার সাথে চুক্তি?', function (pid) { dealForm('', pid); });
      break;
    case 'deal-edit': dealForm(id); break;
    case 'd-len':
      readDealForm();
      if (!DF.d.start) DF.d.start = today();
      DF.d.end = addDays(addMonths(DF.d.start, +a.dataset.m), -1); drawDealForm(); break;
    case 'it-add': readDealForm(); DF.d.items.push({ name: '', qty: 1, where: '', base: 0 }); drawDealForm(); break;
    case 'it-preset': readDealForm(); DF.d.items.push({ name: a.dataset.n, qty: 1, where: '', base: 0 }); drawDealForm(); break;
    case 'it-del': readDealForm(); DF.d.items.splice(+a.dataset.i, 1); drawDealForm(); break;
    case 'k-add': readDealForm(); var last = DF.pays[DF.pays.length - 1];
      DF.pays.push({ label: (DF.pays.length + 1) + ' নং কিস্তি', due: last && last.due ? addMonths(last.due, 1) : (DF.d.start || today()), amount: '', mode: S.set.payMode, st: 'due' }); drawDealForm(); break;
    case 'k-del': readDealForm(); var kk = DF.pays[+a.dataset.i];
      if (kk && kk.st === 'paid' && !confirm('এই কিস্তি "দেওয়া হয়েছে" — তবু তালিকা থেকে সরাবেন?')) return;
      DF.pays.splice(+a.dataset.i, 1); drawDealForm(); break;
    case 'k-gen': genPays(); break;
    case 'deal-save':
      readDealForm();
      var D0 = DF.d;
      if (!String(D0.title).trim()) { toast('শিরোনাম লিখুন।'); $('d_title').focus(); return; }
      var tsum = DF.pays.reduce(function (s, k) { return s + num(k.amount); }, 0);
      if (num(D0.total) && DF.pays.length && Math.abs(tsum - num(D0.total)) > 1 && !confirm('কিস্তির যোগফল (' + tk(tsum) + ') মোট টাকার (' + tk(D0.total) + ') সাথে মিলছে না। তবু সেভ করবেন?')) return;
      api('apiSaveDeal', [{ id: D0.id || '', pid: D0.pid, title: D0.title, type: D0.type, start: D0.start, end: D0.end, total: D0.total, items: D0.items, status: D0.status, note: D0.note,
        pays: DF.pays.map(function (k) { return { id: k.id || '', label: k.label, due: k.due, amount: k.amount, mode: k.mode, st: k.st, note: k.note }; }) }], a).then(function (r) {
        upsert(S.deals, r.deal); S.pays = S.pays.filter(function (k) { return k.did !== r.deal.id; }).concat(r.pays); upsert(S.partners, r.partner); index();
        closeOv(); rerender(); toast('✅ চুক্তি সেভ হয়েছে'); dealView(r.deal.id);
      });
      break;
    case 'deal-del':
      if (!confirm('চুক্তিটা, তার সব কিস্তি আর জমা পড়া কাজের তালিকা মুছে ফেলবেন? ফেরানো যাবে না।\n(শেষ হয়ে থাকলে মোছার বদলে অবস্থা "শেষ" করে রাখাই ভালো।)')) return;
      api('apiDeleteDeal', [id], a).then(function () {
        removeId(S.deals, id); S.pays = S.pays.filter(function (k) { return k.did !== id; }); S.works = S.works.filter(function (w) { return w.did !== id; });
        index(); closeOv(); rerender(); toast('মোছা হয়েছে');
      });
      break;

    case 'pay-req':
      var kq = S.K[id];
      copyText(accText(kq));
      api('apiPayAction', [id, 'req', {}], a).then(function (k) {
        upsert(S.pays, k); index(); refreshAfterPay(k);
        toast('📨 অনুরোধের লেখা কপি হয়েছে — হিসাব বিভাগকে পাঠিয়ে দিন', 6000);
      });
      break;
    case 'pay-paid': S.ret = $('ov') && $('ov').dataset.deal ? $('ov').dataset.deal : ''; paidForm(id); break;
    case 'pay-due':
      api('apiPayAction', [id, 'due', {}], a).then(function (k) { upsert(S.pays, k); index(); refreshAfterPay(k); toast('⏳ "বাকি" করা হলো'); });
      break;
    case 'pp-save':
      api('apiPayAction', [id, 'paid', { date: $('pp_d').value, amount: $('pp_a').value, method: segVal('pp_m'), ref: $('pp_r').value, note: $('pp_n').value }], a).then(function (k) {
        upsert(S.pays, k); index(); closeOv(); refreshAfterPay(k); toast('✅ ' + tk(k.paidAmt) + ' দেওয়া হয়েছে — লেখা হলো');
      });
      break;
    case 'copy-plan':
      var lines = Array.prototype.map.call(document.querySelectorAll('.mon'), function (r) { return r.innerText.replace(/\n+/g, ' — '); }).slice(0, 6);
      copyText('আগামী ৬ মাসে PR-এর কিস্তি (' + (S.set.org || '') + '):\n' + lines.join('\n')).then(function () { toast('📋 কপি হয়েছে'); });
      break;

    case 'work-add': workForm(a.dataset.did, a.dataset.k); break;
    case 'w-save':
      api('apiAddWork', [{ did: a.dataset.did, item: a.dataset.k, date: $('w_date').value, link: $('w_link').value, note: $('w_note').value }], a).then(function (w) {
        S.works.push(w); index(); rerender(); dealView(w.did); toast('✅ জমা হলো');
      });
      break;
    case 'work-del':
      if (!confirm('এই জমা মুছবেন?')) return;
      var wd = S.works.filter(function (w) { return w.id === id; })[0];
      api('apiDeleteWork', [id]).then(function () { removeId(S.works, id); index(); rerender(); if (wd) dealView(wd.did); });
      break;

    case 'set-sw': a.classList.toggle('on'); break;
    case 'set-save':
      saveSettings({ remindDays: $('s_remindDays').value, fuDays: $('s_fuDays').value, endWarn: $('s_endWarn').value, weekGoal: $('s_weekGoal').value,
        payMode: segVal('s_payMode'), todo: document.querySelector('[data-k="todo"]').classList.contains('on'), digest: document.querySelector('[data-k="digest"]').classList.contains('on') }, a);
      break;
    case 'set-save2':
      saveSettings({ org: $('s_org').value, me: $('s_me').value, mailSubj: $('s_mailSubj').value, mailBody: $('s_mailBody').value, waBody: $('s_waBody').value }, a);
      break;
    case 'cat-add':
      var nc = $('s_cat').value.trim(); if (!nc) return;
      saveSettings({ cats: (S.set.cats || []).concat([nc]) }, a);
      break;
    case 'cat-del':
      var cs = (S.set.cats || []).slice(); cs.splice(+a.dataset.i, 1); saveSettings({ cats: cs }); break;
    case 'sync-now':
      api('apiSyncNow', [], a).then(function (s) { S.sync = s; rerender(); toast(s.ok ? '✅ To-Do-তে পাঠানো হলো' : '⚠️ ' + (s.err || 'ব্যর্থ'), 5000); });
      break;
    case 'activity':
      api('apiActivity', [], a).then(function (L) {
        $('actBox').innerHTML = L.length ? '<div class="logl">' + L.map(function (x) { return '<div><small>' + esc(x.at) + '</small> · <b>' + esc(x.what) + '</b> — ' + esc(x.detail) + '</div>'; }).join('') + '</div>' : 'কিছু নেই।';
        $('actBox').className = '';
      });
      break;
    case 'sec-rv': api('apiRevokeSession', [id], a).then(drawSecurity); break;
    case 'sec-others': if (confirm('এই ডিভাইস বাদে সব জায়গা থেকে লগআউট করবেন?')) api('apiRevokeOthers', [], a).then(drawSecurity); break;
  }
});
/* কিস্তি বদলের পর — চুক্তির বিস্তারিত খোলা থাকলে (বা সেখান থেকে "দেওয়া হয়েছে" ফর্মে গেলে) আবার সেখানেই ফেরা */
function refreshAfterPay(k) {
  var back = S.ret || ($('ov') && $('ov').dataset.deal);
  S.ret = '';
  rerender();
  if (back) dealView(k.did);
}
function saveSettings(x, btn) {
  return api('apiSaveSettings', [x], btn).then(function (s) { S.set = s; ORG = s.org || ORG; rerender(); toast('✅ সেভ হয়েছে'); });
}

document.addEventListener('input', function (ev) {
  var t = ev.target;
  if (t.id === 'pfQ') { S.pf.q = t.value; $('pfList').innerHTML = partnerList(); }
  else if (t.id === 'ffQ') { S.ff.q = t.value; $('ffList').innerHTML = findList(); }
  else if (t.id === 'qaLink') { qaRead(); qaLinkChanged(); }
  else if (t.id === 'qaName') { qaRead(); qaDupCheck(); }
  else if (/^qa/.test(t.id)) qaRead();
  else if (t.id === 'bkTxt') {
    var L = bulkParse(t.value), dup = L.filter(function (x) { return findDup(x.name, [x.link]); }).length;
    $('bkPrev').textContent = L.length ? L.length + ' জন পাওয়া গেছে' + (dup ? ' · ' + dup + ' জন আগেই আছেন (বাদ যাবেন)' : '') + ' — প্রথম: ' + (L[0].name || L[0].link) : '';
  }
  else if (t.id === 'd_total' && DF) { readDealForm(); var s = $('ov').querySelector('.sumline'); if (s) { var sum = DF.pays.reduce(function (a, k) { return a + num(k.amount); }, 0), tot = num(DF.d.total); s.innerHTML = '<span>কিস্তির যোগফল: <b>' + tk(sum) + '</b></span>' + (tot && DF.pays.length && Math.abs(sum - tot) > 1 ? '<span class="bad">মোট টাকার সাথে ' + tk(tot - sum) + ' গরমিল</span>' : ''); } }
  else if (t.dataset && t.dataset.f === 'amount' && DF) { readDealForm(); var s2 = $('ov').querySelector('.sumline'); if (s2) { var sm = DF.pays.reduce(function (a, k) { return a + num(k.amount); }, 0), tt = num(DF.d.total); s2.innerHTML = '<span>কিস্তির যোগফল: <b>' + tk(sm) + '</b></span>' + (tt && Math.abs(sm - tt) > 1 ? '<span class="bad">মোট টাকার সাথে ' + tk(tt - sm) + ' গরমিল</span>' : ''); } }
});
document.addEventListener('change', function (ev) {
  var t = ev.target;
  if (t.id === 'pfKind') { S.pf.kind = t.value; $('pfList').innerHTML = partnerList(); }
  else if (t.id === 'pfCat') { S.pf.cat = t.value; $('pfList').innerHTML = partnerList(); }
  else if (t.id === 'pfSort') { S.pf.sort = t.value; $('pfList').innerHTML = partnerList(); }
  else if (t.id === 'ffCat') { qaRead(); S.ff.cat = t.value; QA.cat = t.value; rerender(); }
  else if (t.id === 'ffCat2') { S.ff.cat = t.value; $('ffList').innerHTML = findList(); }
  else if (t.id === 'ffSort') { S.ff.sort = t.value; $('ffList').innerHTML = findList(); }
  else if (t.id === 'pStage') {
    var pid = t.dataset.id, v = t.value, p = S.P[pid];
    var ask = OPEN_ST[v] && !p.next;
    var nx = ask ? addDays(today(), +S.set.fuDays || 3) : undefined;
    api('apiSetStage', nx ? [pid, v, nx, p.nextNote || ''] : [pid, v]).then(function (np) {
      upsert(S.partners, np); index(); rerender();
      toast('ধাপ: ' + STG[v].l + (nx ? ' · পরের খোঁজ ' + dShort(nx) + ' (বদলানো যাবে)' : ''));
      if (v === 'deal' && !(S.DB[pid] || []).length) setTimeout(function () { toast('চুক্তির তথ্য দেবেন?', 8000, ['📄 নতুন চুক্তি', function () { dealForm('', pid); }]); }, 300);
    }, function () { t.value = p.stage; });
  }
});
document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Escape' && $('ov')) closeOv();
  if (ev.key === 'Enter' && ev.target.id === 's_cat') { ev.preventDefault(); document.querySelector('[data-a="cat-add"]').click(); }
  if (ev.key === 'Enter' && /^qa(Link|Name|Fol|Src)$/.test(ev.target.id)) { ev.preventDefault(); document.querySelector('[data-a="qa-add"]').click(); }
  if ((ev.ctrlKey || ev.metaKey) && ev.key === 'Enter' && $('ov')) { var b = $('ov').querySelector('.sh-f .btn.pri'); if (b) { ev.preventDefault(); b.click(); } }
});
$('menuBtn').addEventListener('click', function (e) { e.stopPropagation(); $('menu').hidden = !$('menu').hidden; });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { if (THEME === 'auto') applyTheme(); });
document.addEventListener('visibilitychange', function () {   // অনেকক্ষণ পর ফিরলে নতুন তথ্য
  if (document.visibilityState === 'visible' && S.booted && AUTH && Date.now() - (S._lastBoot || 0) > 5 * 60000 && !$('ov')) {
    S._lastBoot = Date.now();
    callServer('apiBoot', []).then(function (d) { applyBoot(d); saveBootCache(); if (!$('ov')) rerender(); }, function () {});
  }
});

/* ---------- লগইন ---------- */
var LG = { email: '' };
function showLogin() {
  $('app').hidden = true; $('login').hidden = false;
  $('lgOrg').textContent = ORG + ' — পিআর ও পার্টনারশিপ';
  lgStep(1);
  if (window.appLockWaitLogin) appLockWaitLogin();
}
function showApp() {
  $('login').hidden = true; $('app').hidden = false;
  S._lastBoot = Date.now();
  boot();
}
function lgStep(n) {
  $('lgStep1').hidden = n !== 1; $('lgStep2').hidden = n !== 2; $('lgBack').hidden = n !== 2;
  $('lgBtn').textContent = n === 1 ? 'কোড পাঠান' : 'লগইন';
  lgMsg(n === 2 ? LG.email + ' — ইনবক্সে কোড গেছে (Spam-ও দেখুন)।' : '', true);
  setTimeout(function () { (n === 1 ? $('lgEmail') : $('lgCode')).focus(); }, 30);
}
function lgMsg(m, ok) { var e = $('lgMsg'); e.textContent = m; e.className = 'lg-msg' + (ok ? ' ok' : ''); }
function device() {
  var u = navigator.userAgent;
  var os = /Android/.test(u) ? 'Android' : /iPhone|iPad/.test(u) ? 'iPhone' : /Windows/.test(u) ? 'Windows' : /Mac/.test(u) ? 'Mac' : 'অন্য';
  var br = /Edg\//.test(u) ? 'Edge' : /Chrome\//.test(u) ? 'Chrome' : /Firefox\//.test(u) ? 'Firefox' : /Safari\//.test(u) ? 'Safari' : 'Browser';
  return os + ' · ' + br;
}
$('lgForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var btn = $('lgBtn'); if (btn.disabled) return;
  var step1 = !$('lgStep1').hidden;
  var done = function () { btn.disabled = false; btn.textContent = step1 ? 'কোড পাঠান' : 'লগইন'; };
  if (step1) {
    var em = $('lgEmail').value.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { lgMsg('ঠিক ইমেইল লিখুন।'); return; }
    btn.disabled = true; btn.textContent = '⏳ পাঠানো হচ্ছে…'; lgMsg('');
    callServer('apiSendCode', [em]).then(function () { LG.email = em; done(); lgStep(2); }, function (err) { done(); lgMsg(err.message); });
  } else {
    var code = $('lgCode').value.replace(/\D/g, '');
    if (code.length !== 6) { lgMsg('৬ সংখ্যার কোড লিখুন।'); return; }
    btn.disabled = true; btn.textContent = '⏳ যাচাই হচ্ছে…'; lgMsg('');
    callServer('apiVerifyCode', [LG.email, code, device()]).then(function (tok) {
      done(); setAuth(tok); $('lgCode').value = '';
      showApp();
      if (window.appLockAfterLogin) appLockAfterLogin();
    }, function (err) { done(); lgMsg(err.message); });
  }
});
$('lgBack').addEventListener('click', function () { lgStep(1); });

function logoutLocal() {
  setAuth(''); S.booted = false; closeOv();
  showLogin();
}

/* ---------- শুরু ---------- */
if (AUTH) showApp(); else showLogin();
</script>
</body>
