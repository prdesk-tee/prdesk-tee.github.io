<script>
/* বাংলা ফন্ট — সেটিংস থেকে বদলানো যায় (এই ডিভাইসে মনে থাকে) */
var FONTS = { noto: ['Noto Sans Bengali', 'Noto+Sans+Bengali:wght@400;500;600;700'], anek: ['Anek Bangla', 'Anek+Bangla:wght@400;500;600;700'],
              baloo: ['Baloo Da 2', 'Baloo+Da+2:wght@400;500;600;700'], tiro: ['Tiro Bangla', 'Tiro+Bangla'], hind: ['Hind Siliguri', 'Hind+Siliguri:wght@400;500;600;700'] };
var FONT = 'noto';
try { FONT = localStorage.getItem('prd_font') || 'noto'; } catch (e) {}
function applyFont(k) {
  if (!FONTS[k]) k = 'noto';
  FONT = k;
  if (k !== 'noto' && !document.getElementById('font_' + k)) {
    var l = document.createElement('link'); l.id = 'font_' + k; l.rel = 'stylesheet';
    l.href = 'https://fonts.googleapis.com/css2?family=' + FONTS[k][1] + '&display=swap'; document.head.appendChild(l);
  }
  document.documentElement.style.setProperty('--bf', "'" + FONTS[k][0] + "','Noto Sans Bengali','Nirmala UI',system-ui,sans-serif");
}
applyFont(FONT);
</script>
<script>
/* =========================================================
 *  PR Desk — ক্রিয়েটর, এজেন্সি, টিভি-পত্রিকার সাথে যোগাযোগ, চুক্তি, কিস্তি, কাজ জমা, নতুন খোঁজ
 *  API_URL = PR Desk-এর Apps Script ("Anyone" deployment) /exec লিংক।
 *  পেজ public — কোনো গোপন তথ্য নেই; নিরাপত্তা লগইন টোকেন + PIN থেকে।
 * ========================================================= */
var API_URL = 'https://script.google.com/macros/s/AKfycbz-eFPmsINRONgL5PkZHPvcUkTMDTer9fTqCCoHNsN-T-ahE8VN_4afqinI2DEHr-A/exec';

// github.io-র সব রিপোজিটরি একই storage ভাগ করতে পারে — তাই সব key-তে "prd_"
var AUTH_KEY = 'prd_auth', BOOT_KEY = 'prd_boot_v1';
var AUTH = '';
try { AUTH = localStorage.getItem(AUTH_KEY) || ''; } catch (e) {}
function setAuth(t) {
  AUTH = t || '';
  try { if (AUTH) localStorage.setItem(AUTH_KEY, AUTH); else { localStorage.removeItem(AUTH_KEY); localStorage.removeItem(BOOT_KEY); } } catch (e) {}
}

var THEME = 'auto';
try { THEME = localStorage.getItem('prd_theme') || 'auto'; } catch (e) {}
function applyTheme() {
  var t = THEME === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : THEME;
  document.documentElement.setAttribute('data-theme', t);
}
applyTheme();

var ORG = 'Technique Easy Education';
try { var _b = JSON.parse(localStorage.getItem(BOOT_KEY) || 'null'); if (_b && _b.data && _b.data.set) ORG = _b.data.set.org || ORG; } catch (e) {}

/* text/plain POST — preflight ছাড়াই সরাসরি Apps Script-এ; ৪০ সেকেন্ডে উত্তর না এলে বাতিল */
function callServer(fn, args) {
  var ctl = window.AbortController ? new AbortController() : null;
  var tm = ctl ? setTimeout(function () { ctl.abort(); }, 40000) : 0;
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fn, args: args || [], auth: AUTH }),
    signal: ctl ? ctl.signal : undefined
  }).then(function (r) {
    clearTimeout(tm);
    if (!r.ok) throw new Error('সার্ভার সাড়া দিচ্ছে না (' + r.status + ') — একটু পরে আবার চেষ্টা করুন।');
    return r.json().catch(function () { throw new Error('সার্ভারের উত্তর বোঝা যায়নি।'); });
  }, function () {
    clearTimeout(tm);
    throw new Error('সার্ভারে পৌঁছানো যায়নি — ইন্টারনেট সংযোগ দেখুন।');
  }).then(function (j) {
    if (!j || !j.ok) throw new Error((j && j.error) || 'অজানা সমস্যা।');
    return j.data;
  });
}

/* ব্যক্তিগত লোগো "Matra Logic" — Developed By-এর সামনে */
function markSvg(cls) {
  return '<svg class="mk ' + (cls || '') + '" viewBox="0 0 100 100" aria-hidden="true">' +
    '<path d="M8 18H92M16 88 40 18 64 88" fill="none" stroke="url(#mkg)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<path d="M84 18V88" fill="none" stroke="url(#mkg)" stroke-width="9" stroke-linecap="round"/>' +
    '<circle cx="40" cy="64" r="7.5" fill="url(#mkg)"/></svg>';
}
</script>
<style>
:root{
  --bf:'Noto Sans Bengali','Nirmala UI',system-ui,sans-serif;
  --bg:#f6f6f8; --card:#ffffff; --ink:#18181b; --ink2:#52525b; --ink3:#9a9aa4;
  --line:#ececf0; --soft:#f4f4f6; --hover:#fafafb;
  --acc:#db2777; --acc-d:#be185d; --acc-s:rgba(219,39,119,.08); --acc2:#7c3aed;
  --brand:linear-gradient(135deg,#f43f5e,#db2777 48%,#7c3aed);
  --pos:#16a34a; --pos-s:rgba(22,163,74,.09); --warn:#d97706; --warn-s:rgba(217,119,6,.1);
  --neg:#dc2626; --neg-s:rgba(220,38,38,.08); --info:#2563eb; --info-s:rgba(37,99,235,.08);
  --sh:0 1px 2px rgba(24,24,27,.04); --sh2:0 12px 32px rgba(24,24,27,.10); --top:rgba(246,246,248,.86);
  --m1:#6366f1; --m2:#8b5cf6; --m3:#d946ef; --r:16px;
}
[data-theme=dark]{
  --bg:#0e0e11; --card:#17171b; --ink:#f4f4f5; --ink2:#b4b4bc; --ink3:#71717a;
  --line:#25252b; --soft:#1e1e23; --hover:#1b1b20;
  --acc:#f472b6; --acc-d:#ec4899; --acc-s:rgba(244,114,182,.11);
  --pos:#4ade80; --pos-s:rgba(74,222,128,.1); --warn:#fbbf24; --warn-s:rgba(251,191,36,.1);
  --neg:#f87171; --neg-s:rgba(248,113,113,.1); --info:#60a5fa; --info-s:rgba(96,165,250,.1);
  --sh:0 1px 2px rgba(0,0,0,.3); --sh2:0 16px 40px rgba(0,0,0,.45); --top:rgba(14,14,17,.86);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--bf);font-size:14.5px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
[hidden]{display:none!important}
a{color:var(--acc);text-decoration:none}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.ic.s{width:15px;height:15px}
.ic.l{width:22px;height:22px}
.mk{width:18px;height:18px;flex:none}
.muted{color:var(--ink3)}
.num{font-variant-numeric:tabular-nums}

/* ---------- লগইন ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
  background:radial-gradient(circle at 18% 14%,#be185d 0,transparent 45%),radial-gradient(circle at 86% 90%,#6d28d9 0,transparent 42%),#160b1d}
.lg-card{width:100%;max-width:370px;background:#fff;color:#18181b;border-radius:24px;padding:30px 22px 20px;box-shadow:0 24px 60px rgba(0,0,0,.45);text-align:center}
.lg-card .ic0{width:72px;height:72px;border-radius:20px;display:block;margin:0 auto 12px;box-shadow:0 10px 24px rgba(219,39,119,.3)}
.lg-card h1{font:800 22px 'Plus Jakarta Sans','Inter',sans-serif;letter-spacing:-.02em;margin-bottom:2px}
.lg-card .sub{font-size:13.5px;color:#71717a;margin-bottom:20px}
.lg-card label{display:block;text-align:left;font-size:13px;font-weight:700;color:#3f3f46;margin:0 0 5px}
.lg-card input{width:100%;padding:13px 14px;border:2px solid #ececf0;border-radius:13px;font:600 16px 'Inter',sans-serif;outline:none;color:#18181b;background:#fff}
.lg-card input:focus{border-color:#db2777;box-shadow:0 0 0 3px rgba(219,39,119,.15)}
.lg-card input.code{letter-spacing:8px;text-align:center;font-size:22px}
.lg-btn{width:100%;margin-top:12px;padding:14px;border-radius:13px;color:#fff;font-size:15.5px;font-weight:700;background:linear-gradient(135deg,#f43f5e,#db2777 48%,#7c3aed);box-shadow:0 8px 20px rgba(219,39,119,.35)}
.lg-btn:disabled{opacity:.6;cursor:wait}
.lg-msg{min-height:20px;margin-top:10px;font-size:13px;font-weight:600;color:#c0392b;line-height:1.5}
.lg-msg.ok{color:#2d6a4f}
.lg-link{color:#db2777;font-size:13px;font-weight:700;margin-top:8px}

/* ---------- কাঠামো ---------- */
.shell{min-height:100vh}
.side{display:none}
.topbar{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:var(--top);border-bottom:1px solid var(--line)}
.topbar-in{padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:11px;min-width:0;flex:1}
.brand img{width:36px;height:36px;border-radius:11px;flex:none}
.brand b{display:block;font:800 16px 'Plus Jakarta Sans','Inter',sans-serif;letter-spacing:-.02em;line-height:1.2}
.brand small{display:block;font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{height:38px;min-width:38px;padding:0 9px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:none}
.ib:hover{color:var(--ink);border-color:#d4d4d8}
.menu{position:absolute;right:16px;top:56px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh2);padding:6px;min-width:210px;z-index:30}
.menu button{display:flex;gap:10px;align-items:center;width:100%;color:var(--ink);padding:10px 12px;border-radius:9px;text-align:left}
.menu button:hover{background:var(--soft)}
main{padding:18px 16px 110px;max-width:1240px;margin:0 auto}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bnav button{color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;border-radius:12px;font-size:11px;font-weight:600;position:relative;white-space:nowrap}
.bnav button .ic{width:21px;height:21px}
.bnav button.on{color:var(--acc)}
.nb{position:absolute;top:0;right:calc(50% - 20px);min-width:18px;height:18px;border-radius:9px;background:var(--neg);color:#fff;font:700 11.5px/18px var(--bf);padding:0 5px;text-align:center}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:26;width:54px;height:54px;border-radius:18px;background:var(--brand);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(219,39,119,.35)}
.fab .ic{width:26px;height:26px;stroke-width:2.2}
.dev-foot{display:flex;align-items:center;justify-content:center;gap:7px;font-size:12px;color:var(--ink3);margin:30px 0 4px}
.dev-foot b{font:800 12.5px 'Plus Jakarta Sans','Inter',sans-serif;color:var(--ink2)}
@media(min-width:1000px){
  .shell{display:grid;grid-template-columns:244px 1fr}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:18px 14px 14px;border-right:1px solid var(--line);background:var(--card);overflow-y:auto;scrollbar-width:thin}
  .side .brand{flex:none;margin:0 6px 18px}
  .side .s-new{margin:0 2px 14px;flex:none}
  .side nav{display:flex;flex-direction:column;gap:2px}
  .side nav button{display:flex;align-items:center;gap:12px;color:var(--ink2);padding:9px 12px;border-radius:11px;font-size:14.5px;font-weight:600;text-align:left;position:relative}
  .side nav button:hover{background:var(--soft);color:var(--ink)}
  .side nav button.on{background:var(--acc-s);color:var(--acc)}
  .side nav .nb{position:static;margin-left:auto}
  .side .s-tools{margin-top:auto;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:10px;flex:none}
  .side .s-row{display:flex;gap:4px;padding:2px 4px 0}
  .side .s-row button{flex:1;justify-content:center;padding:8px 0!important}
  .side .s-tools button{display:flex;align-items:center;gap:10px;color:var(--ink2);text-align:left;padding:8px 12px;border-radius:10px;font-size:13.5px}
  .side .s-tools button:hover{background:var(--soft)}
  .side .s-tools button.on{color:var(--acc)}
  .side .s-foot{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink3);padding:10px 8px 0;flex:none;white-space:nowrap}
  .side .s-foot b{font:800 11.5px 'Plus Jakarta Sans','Inter',sans-serif;color:var(--ink2)}
  .topbar,.bnav,.fab,.dev-foot{display:none}
  main{padding:28px 32px 48px}
}

/* ---------- সাধারণ ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:24px;font-weight:700;line-height:1.25;letter-spacing:-.01em}
.ph p{font-size:13.5px;color:var(--ink3);margin-top:2px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:14px}
.cpad{padding:18px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 6px}
.ch h3{font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.ch h3 .cnt{font-size:12px;font-weight:700;color:var(--ink3);background:var(--soft);border-radius:99px;padding:1px 8px}
.ch .lnk{font-size:13px;font-weight:600;color:var(--ink3);display:flex;align-items:center;gap:2px}
.ch .lnk:hover{color:var(--acc)}
.hint{font-size:13px;color:var(--ink3);line-height:1.6}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:8px 14px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:#d4d4d8;background:var(--hover)}
.btn.pri{background:#db2777;color:#fff;border-color:transparent}
.btn.pri:hover{background:#be185d}
.btn.brand{background:var(--brand);color:#fff;border:0;box-shadow:0 8px 20px rgba(219,39,119,.25)}
.btn.ok{color:var(--pos)}
.btn.red{color:var(--neg)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink2)}
.btn.ghost:hover{background:var(--soft)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn.xs{padding:4px 9px;font-size:12.5px;border-radius:9px;gap:5px}
.btn.w{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.in,.sel{width:100%;min-width:0;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14.5px;outline:none;transition:border-color .15s,box-shadow .15s}
.in:focus,.sel:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-s)}
.in::placeholder{color:var(--ink3)}
textarea.in{resize:vertical;min-height:84px;line-height:1.55}
textarea.in.mono{font-family:'Inter',monospace;font-size:13px}
.fl{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin:14px 0 6px}
.fl em{font-style:normal;font-weight:400;color:var(--ink3)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:3px;gap:2px}
.seg button{color:var(--ink2);padding:7px 13px;border-radius:9px;font-size:13.5px;font-weight:600;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
[data-theme=dark] .seg button.on{background:#2a2a31}
.seg button em{font-style:normal;font-size:12px;color:var(--ink3);margin-left:4px}
.seg.full{display:flex}
.seg.full button{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink2);padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap;flex:none}
.chips button em{font-style:normal;color:var(--ink3);margin-left:5px;font-size:12px}
.chips button.on{background:var(--acc-s);border-color:color-mix(in srgb,var(--acc) 45%,transparent);color:var(--acc)}
.chips button.on em{color:var(--acc);opacity:.8}
.nw{white-space:nowrap}
.sw{position:relative;width:42px;height:24px;border-radius:99px;background:#d4d4d8;flex:none;transition:background .2s}
[data-theme=dark] .sw{background:#3f3f46}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.sw.on{background:var(--acc)} .sw.on::after{left:21px}
.swrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.swrow span{flex:1;font-size:14px}
.swrow small{display:block;font-size:12.5px;color:var(--ink3)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;background:var(--soft);color:var(--ink2)}
.pill.ok{background:var(--pos-s);color:var(--pos)} .pill.warn{background:var(--warn-s);color:var(--warn)}
.pill.bad{background:var(--neg-s);color:var(--neg)} .pill.info{background:var(--info-s);color:var(--info)} .pill.acc{background:var(--acc-s);color:var(--acc)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--c,var(--ink3))}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#18181b;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:92vw;text-align:center;display:flex;gap:10px;align-items:center;pointer-events:none}
.toast button{pointer-events:auto;background:rgba(255,255,255,.15);color:#fff;border-radius:8px;padding:5px 10px;font-weight:700;font-size:13px}
@media(min-width:1000px){.toast{bottom:28px}}
.sk{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--soft),var(--line),var(--soft));background-size:200% 100%;animation:sh 1.3s infinite;margin:10px 0}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:30px 16px;color:var(--ink3);font-size:14px;line-height:1.6}
.empty .ic{width:30px;height:30px;display:block;margin:0 auto 8px;opacity:.6}
.err{padding:12px 14px;border-radius:12px;background:var(--neg-s);color:var(--neg);font-size:13.5px;line-height:1.5;margin-bottom:12px}
.note{padding:11px 13px;border-radius:12px;background:var(--soft);font-size:13.5px;color:var(--ink2);line-height:1.6}
.note.warn{background:var(--warn-s);color:var(--warn)}
.bar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden;position:relative}
[data-theme=dark] .bar{background:#2a2a30}
.bar i{display:block;height:100%;border-radius:99px;background:var(--acc)}

/* ---------- সারি ---------- */
.rows{display:flex;flex-direction:column}
.r{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--line);min-width:0}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}

}

<script>
(function () {
  var MODE = '', IDLE = 15 * 60000, MINLEN = 4, KEY = 'prd_appLockLast';
  var root = document.documentElement, box = document.getElementById('alLock');
  function $(id) { return document.getElementById(id); }
  function bn(n) { return String(n).replace(/[0-9]/g, function (d) { return '০১২৩৪৫৬৭৮৯'[d]; }); }
  var mode = '', locked = true, busy = false, mem = 0, lastWrite = 0, loginWait = false;
  $('alOrg').textContent = ORG;

  function readLast() { var v = 0; try { v = Number(localStorage.getItem(KEY)) || 0; } catch (e) {} return Math.max(v, mem); }
  function writeLast(t) { mem = t; lastWrite = Date.now(); try { localStorage.setItem(KEY, String(t)); } catch (e) {} }
  function stale() { return Date.now() - readLast() > IDLE; }

  var TEXT = {
    wait:   { sub: '⏳ একটু অপেক্ষা করুন...', a: 'Please Enter the Pin', btn: 'Enter', busy: '', sw: '' },
    unlock: { sub: '', a: 'Please Enter the Pin', btn: 'Enter', busy: 'Logging IN...', sw: '🔑 PIN change?' },
    setup:  { sub: 'নতুন PIN ঠিক করুন — এরপর থেকে PR Desk খুলতে এই PIN লাগবে। অন্তত ' + bn(MINLEN) + ' অক্ষর।',
              a: 'New PIN', b: 'Confirm PIN', btn: 'Set PIN', busy: '⏳ সেভ হচ্ছে...', sw: '' },
    change: { sub: 'আগে বর্তমান PIN দিন, তারপর নতুন PIN।',
              a: 'Current PIN', b: 'New PIN', c: 'Confirm new PIN', btn: 'Change PIN', busy: '⏳ যাচাই হচ্ছে...', sw: '← ফিরে যান' }
  };
  function setMode(m) {
    mode = m; var t = TEXT[m];
    $('alSub').textContent = t.sub; $('alBtn').textContent = t.btn; $('alBtn').disabled = m === 'wait';
    $('alLa').textContent = t.a; $('alLb').textContent = t.b || ''; $('alLc').textContent = t.c || '';
    $('alFb').style.display = t.b ? '' : 'none'; $('alFc').style.display = t.c ? '' : 'none';
    $('alSwitch').textContent = t.sw; $('alSwitch').style.display = t.sw ? '' : 'none';
    $('alA').value = $('alB').value = $('alC').value = ''; msg(''); focusA();
  }
  function focusA() { setTimeout(function () { try { $('alA').focus(); } catch (e) {} }, 30); }
  function msg(s, ok) { var e = $('alErr'); e.textContent = s; e.className = 'al-err' + (ok ? ' ok' : ''); }

  function lock() {
    if (!AUTH) { waitForLogin(); return; }
    locked = true; loginWait = false;
    $('alOrg').textContent = ORG;
    root.removeAttribute('data-al-open');
    if (document.activeElement && !box.contains(document.activeElement)) { try { document.activeElement.blur(); } catch (e) {} }
    if (MODE) { setMode(MODE); return; }
    setMode('wait');
    callServer('appLockMode', []).then(function (m) {
      MODE = m === 'setup' ? 'setup' : 'unlock';
      if (locked && mode === 'wait') setMode(MODE);
    }, function (err) {
      if (/AUTH_REQUIRED/.test(err.message)) { setAuth(''); window.showLogin && showLogin(); waitForLogin(); return; }
      msg(err.message); $('alBtn').disabled = false; $('alBtn').textContent = '🔄 আবার চেষ্টা';
    });
  }
  function unlock() {
    locked = false; loginWait = false; writeLast(Date.now());
    $('alA').value = $('alB').value = $('alC').value = '';
    root.setAttribute('data-al-open', '');
  }
  function waitForLogin() { locked = false; loginWait = true; root.setAttribute('data-al-open', ''); }
  window.appLockWaitLogin = waitForLogin;
  window.appLockAfterLogin = function () { MODE = ''; writeLast(0); mem = 0; lock(); };
  window.appLockNow = function () { writeLast(0); mem = 0; lock(); };

  function check() { if (!locked && !loginWait && stale()) lock(); }
  function activity() {
    if (locked || loginWait) return;
    if (stale()) { lock(); return; }
    var n = Date.now(); mem = n;
    if (n - lastWrite > 15000) writeLast(n);
  }
  function run(fn, args, ok) {
    var btn = $('alBtn'), label = btn.textContent;
    busy = true; btn.disabled = true; btn.textContent = TEXT[mode].busy; msg('');
    var done = function () { busy = false; btn.disabled = false; btn.textContent = label; };
    callServer(fn, args).then(function () { done(); ok(); }, function (err) {
      done();
      if (/AUTH_REQUIRED/.test(err.message)) { setAuth(''); window.showLogin && showLogin(); waitForLogin(); return; }
      msg(String(err.message).replace(/^(Exception|Error):\s*/, ''));
      try { $('alA').select(); } catch (e) {}
    });
  }
  $('alForm').addEventListener('submit', function (e) {
    e.preventDefault();
    if (busy) return;
    if (mode === 'wait') { lock(); return; }
    var a = $('alA').value.trim(), b = $('alB').value.trim(), c = $('alC').value.trim();
    if (mode === 'unlock') {
      if (!a) { msg('PIN লিখুন।'); focusA(); return; }
      run('appLockUnlock', [a], unlock);
    } else if (mode === 'setup') {
      if (a.length < MINLEN) { msg('PIN অন্তত ' + bn(MINLEN) + ' অক্ষরের দিন।'); focusA(); return; }
      if (a !== b) { msg('দুইবার একই PIN লিখুন।'); $('alB').focus(); return; }
      run('appLockSetup', [a], function () { MODE = 'unlock'; unlock(); });
    } else {
      if (!a) { msg('বর্তমান PIN লিখুন।'); focusA(); return; }
      if (b.length < MINLEN) { msg('নতুন PIN অন্তত ' + bn(MINLEN) + ' অক্ষরের দিন।'); $('alB').focus(); return; }
      if (b !== c) { msg('নতুন PIN দুইবার একই লিখুন।'); $('alC').focus(); return; }
      run('appLockChange', [a, b], function () { msg('✅ PIN বদলানো হয়েছে।', true); setTimeout(unlock, 900); });
    }
  });
  $('alSwitch').addEventListener('click', function () { if (!busy) setMode(mode === 'change' ? 'unlock' : 'change'); });
  $('alEye').addEventListener('click', function () {
    var on = box.classList.toggle('al-show');
    this.textContent = on ? '🙈 Hide PIN' : '👁 Show PIN'; focusA();
  });
  ['keydown', 'keypress', 'keyup'].forEach(function (t) {
    window.addEventListener(t, function (e) {
      if (locked && !box.contains(e.target)) { e.stopImmediatePropagation(); e.preventDefault(); if (t === 'keydown') focusA(); }
    }, true);
  });
  ['pointerdown', 'mousemove', 'keydown', 'wheel', 'touchstart', 'scroll'].forEach(function (t) {
    document.addEventListener(t, activity, { capture: true, passive: true });
  });
  document.addEventListener('visibilitychange', check);
  window.addEventListener('focus', check);
  window.addEventListener('pagehide', function () { if (!locked && mem) writeLast(mem); });
  setInterval(check, 15000);

  if (!AUTH) waitForLogin();
  else if (!stale()) unlock();
  else lock();
})();
</script>

      partners: S.partners, logs: S.logs, deals: S.deals, pays: S.pays, works: S.works } }));

function api(fn, args, btn) {

  return callServer(fn, args).then(function (d) {

  }, function (err) {

          '<span class="pill ' + (ok ? 'ok' : c.short ? 'bad' : 'warn') + '">' + (ok ? 'পেয়েছি' : 'বাকি ' + bnN(row.exp - row.got)) + '</span></div>';
      }).join('') + '</div></div>' : '') +
    '<div class="card"><div class="ch"><h3>সাম্প্রতিক কনটেন্ট</h3><a class="lnk" href="#content">সব ' + icon('right', 's') + '</a></div>' +
    (recent.length ? '<div class="rows">' + recent.map(function (c) { return contentRow(c); }).join('') + '</div>' : empty('inbox', 'এখনো কোনো কনটেন্ট লেখা হয়নি।<br>কেউ কনটেন্ট দিলে "কনটেন্ট পেলাম" চাপুন।')) +

}


/* ═════════ চুক্তি ═════════ */
function dealsPage() {
  var f = S.df, act = activeDeals();
  var inc = act.filter(function (d) { return calc(d).missing.length; });
  var groups = { active: act, inc: inc, done: S.deals.filter(function (d) { return d.status === 'done'; }), cancel: S.deals.filter(function (d) { return d.status === 'cancel'; }), all: S.deals };
  var L = (groups[f.tab] || act).slice().sort(function (a, b) {

    return (cb.over + cb.short + (cb.behind ? 1 : 0)) - (ca.over + ca.short + (ca.behind ? 1 : 0)) || ((S.P[a.pid] || {}).name || '').localeCompare((S.P[b.pid] || {}).name || '');
  });
  return '<div class="ph"><div><h1>চুক্তি</h1><p>কার সাথে কী চুক্তি, কী পেলাম, কী পাবো, কত টাকা গেল</p></div>' +
    '<div class="acts"><button class="btn pri" data-a="deal-new">' + icon('plus', 's') + 'নতুন চুক্তি</button></div></div>' +
    '<div class="chips" id="dfTab" style="margin-bottom:14px">' + [['active', 'চলছে'], ['inc', 'তথ্য অসম্পূর্ণ'], ['done', 'শেষ'], ['cancel', 'বাতিল'], ['all', 'সব']].map(function (x) {
      return '<button data-v="' + x[0] + '" class="' + (f.tab === x[0] ? 'on' : '') + '">' + x[1] + '<em>' + bnN(groups[x[0]].length) + '</em></button>';
    }).join('') + '</div>' +
    (L.length ? '<div class="dgrid">' + L.map(dealCard).join('') + '</div>' : '<div class="card">' + empty('deal', 'এই তালিকায় কোনো চুক্তি নেই।') + '</div>');
}
function dealCard(d) {
  var c = calc(d), p = S.P[d.pid] || {};
  var period = d.start ? dShort(d.start) + ' – ' + (d.end ? dShort(d.end) : '…') : 'সময়কাল নেই';
  var cPct = c.exp ? Math.min(100, Math.round(c.got / c.exp * 100)) : (c.got ? 100 : 0);
  var mPct = c.total ? Math.min(100, Math.round(c.paid / c.total * 100)) : 0;
  var flag = c.over ? '<span class="pill bad">' + bnN(c.over) + 'টা টাকা বকেয়া</span>' : c.short ? '<span class="pill bad">' + bnN(c.short) + 'টা কনটেন্ট আসেনি</span>' :
    c.behind ? '<span class="pill warn">কাজ পিছিয়ে</span>' : c.missing.length ? '<span class="pill warn">তথ্য দিন</span>' : c.unk ? '<span class="pill warn">যাচাই</span>' :
    d.status === 'active' && c.ended ? '<span class="pill bad">সময় শেষ</span>' : d.status !== 'active' ? '<span class="pill">' + DST[d.status] + '</span>' : '';
  var foot = d.plan === 'month' && c.cur ? 'এ মাসে ' + bnN(c.cur.got) + '/' + bnN(c.cur.exp) :
    c.next ? 'পরের টাকা ' + tk(c.next.amount) + (c.next.due ? ' · ' + dShort(c.next.due) : '') : (d.model === 'per' && d.rate ? 'প্রতিটা ' + tk(d.rate) : esc(d.title));
  return '<div class="dc" data-go="#c/' + esc(d.id) + '"><div class="top">' + av(p) + '<div class="grow"><b>' + esc(p.name || '—') + '</b><small>' + esc(d.title) + ' · ' + period + '</small></div>' + mdl(d.model) + '</div>' +
    '<div class="prog' + (c.short || c.behind ? ' bad' : '') + '"><span>কনটেন্ট</span><div class="bar' + (c.short || c.behind ? ' bad' : cPct >= 100 ? ' ok' : '') + '"><i style="width:' + cPct + '%"></i></div><b>' + bnN(c.got) + (c.exp ? '/' + bnN(c.exp) : '') + '</b></div>' +
    (c.total || c.paid ? '<div class="prog"><span>টাকা</span><div class="bar ok"><i style="width:' + mPct + '%"></i></div><b>' + tkS(c.paid) + (c.total ? ' / ' + tkS(c.total) : '') + '</b></div>' : '') +
    '<div class="foot"><span>' + foot + '</span>' + flag + '</div></div>';
}

function dealPage(id) {
  var d = S.D[id];
  if (!d) return '<div class="card">' + empty('deal', 'চুক্তি পাওয়া যায়নি।<br><a href="#deals">← চুক্তির তালিকা</a>') + '</div>';
  var c = calc(d), p = S.P[d.pid] || {};
  var period = d.start ? dLabel(d.start) + ' – ' + (d.end ? dLabel(d.end) : 'শেষ ঠিক নেই') : 'সময়কাল দেওয়া নেই';
  var mm = MODELS[d.model];
  var prevD = d.prev ? S.D[d.prev] : null, nextD = S.deals.filter(function (x) { return x.prev === d.id; })[0];
  var moneyLbl = d.model === 'per' ? 'প্রতিটা ' + tk(d.rate) + (d.payDays ? ' · পাওয়ার ' + bnN(d.payDays) + ' দিনের মধ্যে' : ' · পাওয়ার দিনই') : '';
  var html = '<div class="ph"><div><button class="btn sm ghost" data-a="back">' + icon('left', 's') + 'ফিরুন</button></div></div>' +
    '<div class="card"><div class="hero">' + av(p, true) + '<div class="who"><h1>' + esc(p.name || '—') + '</h1><p>' + mdl(d.model) + '<span>' + esc(d.title) + '</span><span>·</span><span>' + period + '</span>' +
    (d.status !== 'active' ? '<span class="pill">' + DST[d.status] + '</span>' : c.ended ? '<span class="pill bad">সময় শেষ</span>' : '') + '</p></div>' +
    '<div class="acts"><button class="btn brand" data-a="content-new" data-did="' + esc(d.id) + '">' + icon('plus', 's') + 'কনটেন্ট পেলাম</button>' +
    '<button class="btn" data-a="deal-edit" data-id="' + esc(d.id) + '">' + icon('edit', 's') + 'বদলান</button>' +
    (d.status === 'active' ? '<button class="btn" data-a="renew" data-id="' + esc(d.id) + '">' + icon('renew', 's') + 'নবায়ন</button>' +
      '<button class="btn ghost" data-a="deal-st" data-id="' + esc(d.id) + '" data-v="done" data-busy="…">' + icon('flag', 's') + 'শেষ করুন</button>'
      : '<button class="btn ghost" data-a="deal-st" data-id="' + esc(d.id) + '" data-v="active" data-busy="…">আবার চালু</button>' + (nextD ? '' : '<button class="btn" data-a="renew" data-id="' + esc(d.id) + '">' + icon('renew', 's') + 'নবায়ন</button>')) +
    '<button class="btn ghost" data-go="#p/' + esc(d.pid) + '" title="ক্রিয়েটরের পাতা">' + icon('user', 's') + '</button></div></div>' +
    '<div class="stats"><div><small>কনটেন্ট পাওয়া</small><b>' + bnN(c.got) + (c.exp ? '<em> / ' + bnN(c.exp) + '</em>' : '') + '</b></div>' +
    '<div><small>টাকা দেওয়া হয়েছে</small><b>' + tkS(c.paid) + (c.total ? '<em> / ' + tkS(c.total) + '</em>' : '') + '</b></div>' +
    '<div><small>' + (c.unk ? 'বাকি + অজানা' : 'দিতে বাকি') + '</small><b' + (c.over ? ' style="color:var(--neg)"' : '') + '>' + tkS(c.open) + (c.unk ? '<em> + ' + tkS(c.unk) + '</em>' : '') + '</b></div></div></div>';
  if (prevD || nextD) html += '<div class="note" style="margin-bottom:14px;display:flex;gap:14px;flex-wrap:wrap">' + icon('renew', 's') +
    (prevD ? '<span>আগের মেয়াদ: <a href="#c/' + esc(prevD.id) + '">' + esc(prevD.title) + ' (' + dShort(prevD.start) + ' – ' + dShort(prevD.end) + ')</a></span>' : '') +
    (nextD ? '<span>নবায়ন হয়েছে: <a href="#c/' + esc(nextD.id) + '">' + esc(nextD.title) + ' (' + dShort(nextD.start) + ' থেকে)</a></span>' : '') + '</div>';
  if (c.missing.length) html += '<div class="note warn" style="margin-bottom:14px">' + icon('alert', 's') + ' দেওয়া নেই: ' + c.missing.join(', ') + ' — <a href="#" data-a="deal-edit" data-id="' + esc(d.id) + '">এখনই পূরণ করুন</a></div>';

  // কনটেন্ট
  var cHtml = '<div class="card"><div class="ch"><h3>কনটেন্ট' + (mm ? ' <span class="cnt">' + (d.plan === 'month' ? 'মাসে ' + bnN(c.perM) + 'টা' : 'মোট ' + bnN(c.exp || c.got) + 'টা') + '</span>' : '') + '</h3></div>';
  if (d.plan === 'month' && c.months.length) {
    cHtml += '<div class="mgrid">' + c.months.map(function (r) {
      var slots = r.cs.map(function (x) { return '<button class="slot got' + (x.payId && S.K[x.payId] && S.K[x.payId].st !== 'paid' ? ' x' : '') + '" data-a="content-edit" data-id="' + esc(x.id) + '" title="' + esc(x.title || 'কনটেন্ট') + '">' + esc((x.title || '✓').slice(0, 14)) + '</button>'; }).join('');
      for (var i = r.got; i < r.exp; i++) slots += r.st === 'future' ? '<span class="slot"></span>' : '<button class="slot" data-a="content-new" data-did="' + esc(d.id) + '" data-m="' + r.m + '" title="যোগ করুন">' + icon('plus', 's') + '</button>';
      var lbl = r.st === 'ok' ? '✓' : r.st === 'future' ? '' : bnN(r.got) + '/' + bnN(r.exp);
      return '<div class="mo ' + r.st + '"><div class="mh">' + mShort(r.m) + '<span>' + lbl + '</span></div><div class="slots">' + slots + '</div></div>';
    }).join('') + '</div>';
    if (c.items.length > 1) cHtml += '<div class="ip">' + c.items.map(itemProg).join('') + '</div>';
  } else if (c.items.length) {
    cHtml += '<div class="ip">' + c.items.map(itemProg).join('') + '</div>';
  }
  cHtml += c.cs.length ? '<div class="rows" style="border-top:1px solid var(--line)">' + c.cs.map(function (x) { return contentRow(x, { noName: true }); }).join('') + '</div>'
    : (c.items.length || c.months.length ? '' : empty('film', 'কী কী দেবে তা লেখা নেই — "বদলান" থেকে দিন।'));
  cHtml += '</div>';
  // টাকা
  var mHtml = '<div class="card"><div class="ch"><h3>টাকা</h3>' + (moneyLbl ? '<span class="muted" style="font-size:13px">' + moneyLbl + '</span>' : '') + '</div>' +
    (c.ks.length ? '<div class="rows">' + c.ks.map(function (k) { return payRow(k, { noName: true, noLink: true, undo: true }); }).join('') + '</div>'
      : empty('wallet', d.model === 'per' ? 'কনটেন্ট পেলে প্রতিটার টাকা এখানে নিজে যোগ হবে।' : 'টাকার হিসাব নেই — "বদলান" থেকে দিন।')) + '</div>';
  html += '<div>' + cHtml + '</div><div>' + mHtml +
    (d.note ? '<div class="card"><div class="ch"><h3>শর্ত ও নোট</h3></div><div class="cpad" style="padding-top:4px;font-size:14px;line-height:1.7">' + esc(d.note).replace(/\n/g, '<br>') + '</div></div>' : '') + '</div>';
  return html;
}
function itemProg(i) {
  var w = i.qty > 0 ? Math.min(100, Math.round(i.got / i.qty * 100)) : (i.got ? 100 : 0);
  var mk = i.exp != null && i.qty > 0 ? '<s style="left:' + Math.min(100, Math.round(i.exp / i.qty * 100)) + '%"></s>' : '';
  return '<div class="prog' + (i.lag ? ' bad' : '') + '"><span title="' + esc(i.where || '') + '">' + esc(i.name) + '</span><div class="bar' + (i.lag ? ' bad' : i.qty && i.got >= i.qty ? ' ok' : '') + '"><i style="width:' + w + '%"></i>' + mk + '</div><b>' + bnN(i.got) + (i.qty > 0 ? '/' + bnN(i.qty) : '') + '</b></div>';
}


/* ═════════ কনটেন্ট (মাস ধরে) ═════════ */
function contentPage() {
  var m = S.cf.m || curM(), q = nameKey(S.cf.q), cm = curM();
  var isPast = m < cm, isFuture = m > cm;
  var rows = S.deals.filter(function (d) {
    if (d.status === 'cancel') return false;
    if (d.plan === 'month') return dealMonths(d).indexOf(m) !== -1;
    if (d.status !== 'active' && !(S.CB[d.id] || []).some(function (c) { return c.month === m; })) return false;
    return (!d.start || d.start.slice(0, 7) <= m) && (!d.end || d.end.slice(0, 7) >= m);
  }).map(function (d) {
    var c = calc(d), p = S.P[d.pid] || {}, inM = (S.CB[d.id] || []).filter(function (x) { return x.month === m; }).length;
    var r = d.plan === 'month' ? (c.months.filter(function (x) { return x.m === m; })[0] || { got: 0, exp: c.perM }) : null;
    var st;   // ok / warn / bad / none
    if (r) st = r.got >= r.exp ? 'ok' : isPast ? 'bad' : 'warn';
    else st = c.exp && c.got >= c.exp ? 'ok' : (c.behind && m === cm) ? 'bad' : 'none';   // পুরো মেয়াদের পিছিয়ে থাকা শুধু এ মাসে দেখায়
    return { d: d, c: c, p: p, r: r, inM: inM, st: st };
  }).filter(function (x) { return !q || nameKey(x.p.name).indexOf(q) !== -1; })
    .sort(function (a, b) { var o = { bad: 0, warn: 1, none: 2, ok: 3 }; return o[a.st] - o[b.st] || (a.p.name || '').localeCompare(b.p.name || ''); });
  var monthly = rows.filter(function (x) { return x.r; });
  var mExp = monthly.reduce(function (s, x) { return s + x.r.exp; }, 0), mGot = monthly.reduce(function (s, x) { return s + Math.min(x.r.got, x.r.exp); }, 0);
  var behindN = rows.filter(function (x) { return x.st === 'bad'; }).length;
  var list = S.works.filter(function (w) { return w.month === m; }).filter(function (w) {
    var d = S.D[w.did] || {}, p = S.P[d.pid] || {};
    return !q || nameKey(p.name).indexOf(q) !== -1 || nameKey(w.title).indexOf(q) !== -1;
  }).sort(function (a, b) { return (b.date + b.id) < (a.date + a.id) ? -1 : 1; });
  var pill = function (x) {
    if (x.r) return x.st === 'ok' ? '<span class="pill ok">পেয়েছি</span>' : '<span class="pill ' + x.st + '">' + (isPast ? 'আসেনি ' : 'বাকি ') + bnN(x.r.exp - x.r.got) + '</span>';
    if (x.st === 'bad') return '<span class="pill bad">পিছিয়ে ' + bnN(x.c.behind) + '</span>';
    if (x.st === 'ok') return '<span class="pill ok">সব পেয়েছি</span>';
    return x.c.exp ? '<span class="pill">বাকি ' + bnN(Math.max(0, x.c.exp - x.c.got)) + '</span>' : '<span class="pill">দরকারমতো</span>';
  };
  return '<div class="ph"><div><h1>কনটেন্ট</h1><p>কে কী দিল, কার কাছে কী বাকি — লিংক আর মূল ফাইলসহ</p></div>' +
    '<div class="acts"><button class="btn brand" data-a="content-new">' + icon('plus', 's') + 'কনটেন্ট পেলাম</button></div></div>' +
    '<div class="tools"><div class="mnav"><button data-a="cm" data-k="-1" aria-label="আগের মাস">' + icon('left') + '</button><b>' + mLabel(m) + '</b><button data-a="cm" data-k="1" aria-label="পরের মাস">' + icon('right') + '</button></div>' +
    (m !== cm ? '<button class="btn sm ghost" data-a="cm" data-k="0">এ মাস</button>' : '') +
    '<div class="srch">' + icon('search', 's') + '<input class="in" id="cfQ" placeholder="ক্রিয়েটর বা কনটেন্ট খুঁজুন" value="' + esc(S.cf.q) + '"></div></div>' +
    '<div class="kpis"><div class="kpi"><small>' + icon('inbox', 's') + mLabel(m) + '-এ পাওয়া</small><b>' + bnN(list.length) + '<em> টা</em></b><div class="sub">সব চুক্তি মিলিয়ে</div></div>' +
    '<div class="kpi"><small>' + icon('cal', 's') + 'মাসিক চুক্তিতে</small><b>' + (monthly.length ? bnN(mGot) + '<em> / ' + bnN(mExp) + '</em>' : '—') + '</b><div class="sub">' + (monthly.length ? bnN(monthly.length) + 'টা মাসিক চুক্তি' : 'কোনো মাসিক চুক্তি নেই') + '</div></div>' +
    '<div class="kpi' + (behindN ? ' bad' : '') + '"><small>' + icon('alert', 's') + 'পিছিয়ে / আসেনি</small><b>' + bnN(behindN) + '<em> জন</em></b><div class="sub">' + (isFuture ? 'সামনের মাস' : isPast ? 'মাস পেরিয়ে গেছে' : 'মাস শেষ ' + rel(addDays(addMonths(m + '-01', 1), -1))) + '</div></div></div>' +
    '<div class="cols"><div><div class="card"><div class="ch"><h3>কার কাছে কী পাওয়ার কথা <span class="cnt">' + bnN(rows.length) + '</span></h3></div>' +
    (rows.length ? '<table class="ctab"><thead><tr><th>ক্রিয়েটর</th><th>' + (monthly.length ? 'এ মাসে' : 'পাওয়া') + '</th><th class="hm">পুরো মেয়াদে</th><th></th></tr></thead><tbody>' + rows.map(function (x) {

/* ═════════ সব ক্লিক এক জায়গায় ═════════ */
document.addEventListener('click', function (ev) {
  var t = ev.target;
  if (!$('menu').hidden && !$('menu').contains(t) && !$('menuBtn').contains(t)) $('menu').hidden = true;
  var g = t.closest('[data-go]');
  if (g && !t.closest('[data-a]:not([data-go])') && !t.closest('a[href]:not([data-go])')) {
    var tab = g.dataset.tab, h = g.getAttribute('data-go');
    if (tab) { if (h === '#money') S.mf.tab = tab; else if (h === '#deals') S.df.tab = tab; else if (h === '#people') S.pf.tab = tab; }
    if ($('ov')) closeOv();
    if (!$('menu').hidden) $('menu').hidden = true;
    go(h); return;
  }
  if (t.closest('a[data-close]')) { closeOv(); return; }
  var sb = t.closest('.seg button');
  if (sb) {
    var sid = sb.parentNode.id;
    if (sid === 'd_plan') { readDealForm(); DF.d.plan = sb.dataset.v; drawDealForm(); return; }
    if (sid === 'd_status' && DF) DF.d.status = sb.dataset.v;
    if (sid === 'lgVia') LG2.via = sb.dataset.v;
    if (sid === 'ffLang') { var autoQ = FF.q === kwOf(FF.cat, FF.lang); FF.lang = sb.dataset.v; if (autoQ) FF.q = kwOf(FF.cat, FF.lang); rerender(); return; }
    sb.parentNode.querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b === sb); });
    return;
  }
  var cb = t.closest('.chips button');
  if (cb) {
    var cid = cb.parentNode.id;
    if (cid === 'pfTab') S.pf.tab = cb.dataset.v; else if (cid === 'dfTab') S.df.tab = cb.dataset.v; else if (cid === 'mfTab') S.mf.tab = cb.dataset.v; else if (cid === 'rfPer') RF.per = cb.dataset.v;
    rerender(); return;
  }
  var a = t.closest('[data-a]'); if (!a) return;
  var A = a.getAttribute('data-a'), id = a.getAttribute('data-id');
  if (a.tagName === 'A' && A !== 'mail' && A !== 'wa' && A !== 'deal-edit') return;
  if (a.tagName === 'A' && A === 'deal-edit') ev.preventDefault();
  switch (A) {
    case 'close': closeOv(); break;
    case 'reboot': S.bootErr = ''; boot(); break;
    case 'hardreload': try { localStorage.removeItem(BOOT_KEY); } catch (e) {} location.reload(); break;
    case 'font': applyFont(a.dataset.v); try { localStorage.setItem('prd_font', FONT); } catch (e) {} rerender(); toast('ফন্ট: ' + FONTS[FONT][0]); break;
    case 'theme': THEME = THEME === 'auto' ? 'dark' : THEME === 'dark' ? 'light' : 'auto'; try { localStorage.setItem('prd_theme', THEME); } catch (e) {} applyTheme(); $('menu').hidden = true; toast('থিম: ' + ({ auto: 'যন্ত্রের মতো', dark: 'অন্ধকার', light: 'আলো' })[THEME]); break;
    case 'lock': $('menu').hidden = true; if (window.appLockNow) appLockNow(); break;
    case 'logout': if (confirm('লগআউট করবেন?')) { callServer('apiLogout', []).catch(function () {}); logoutLocal(); } break;
    case 'more': S.open[a.dataset.k] = !S.open[a.dataset.k]; rerender(); break;
    case 'back': if (history.length > 1) history.back(); else go('#home'); break;
    case 'new-menu': newMenu(); break;
    case 'jump': var el = $('todoCard'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); break;
    case 'cm': S.cf.m = a.dataset.k === '0' ? curM() : mAdd(S.cf.m || curM(), +a.dataset.k); rerender(); break;

    /* কনটেন্ট */

    case 'content-edit': contentForm({ id: id }); break;
    case 'cf-change': var keepM = $('cf_m') ? $('cf_m').value : ''; closeOv(); var act = activeDeals();
      pickList('কার কনটেন্ট?', act.map(function (d) { var p = S.P[d.pid] || {}; return { id: d.id, name: p.name || d.title, sub: d.title, p: p }; }), function (did) { contentForm({ did: did, m: keepM }); }); break;
    case 'cf-save':
      var links = {}; PLAT.forEach(function (x) { var v = $('cf_' + x[0]).value.trim(); if (v) links[x[0]] = v; });
      var x = { id: CF.id, did: CF.did, month: $('cf_m').value, date: $('cf_date').value, item: $('cf_item') ? $('cf_item').value : '', title: $('cf_title').value,
                drive: $('cf_drive').value, links: links, note: $('cf_note').value, paid: segVal('cf_paid') === '1' };
      api('apiSaveContent', [x], a).then(function (r) {
        upsert(S.works, r.content); if (r.pay) upsert(S.pays, r.pay); if (r.partner) upsert(S.partners, r.partner); index(); closeOv(); rerender();
        toast(x.id ? 'কনটেন্ট বদলানো হলো' : 'কনটেন্ট লেখা হলো' + (r.pay && r.pay.st !== 'paid' ? ' · ' + tk(r.pay.amount) + ' দিতে হবে' : ''));
      });

      var cid2 = CF.id;
      api('apiDeleteContent', [cid2], a).then(function (r) { removeId(S.works, cid2); if (r.payGone) removeId(S.pays, r.payGone); index(); closeOv(); rerender(); toast('মোছা হয়েছে'); });
      break;

    /* ক্রিয়েটর */
    case 'partner-new': partnerForm(''); break;
    case 'partner-edit': partnerForm(id); break;

      if (!$('f_name').value.trim()) { toast('নাম লিখুন।'); $('f_name').focus(); return; }

      break;

      api('apiSetStage', [id, a.dataset.v], a).then(function (p) {

      });
      break;
    case 'qa-add':
      qaRead();
      if (!QA.name.trim() && QA.link.trim()) QA.name = nameFromUrl(QA.link);

        else toast('⚠️ ' + (r.skipped[0] ? r.skipped[0].why : 'যোগ হয়নি'), 5000);

/* ═════════ রিপোর্ট ═════════ */
var RF = { per: 'all', q: '', sort: 'paid', model: '' };
function repRange() {
  var t = today();
  if (RF.per === 'year') return [t.slice(0, 4) + '-01-01', t];
  if (RF.per === '12m') return [addDays(addMonths(t, -12), 1), t];
  if (RF.per === 'last') { var y = +t.slice(0, 4) - 1; return [y + '-01-01', y + '-12-31']; }
  return ['0000-00-00', '9999-12-31'];
}
function repData() {
  var R = repRange(), a = R[0], b = R[1], inR = function (d) { return d && d >= a && d <= b; };
  var rows = [];
  S.partners.forEach(function (p) {
    var ds = (S.DB[p.id] || []).filter(function (d) { return d.status !== 'cancel' && (!RF.model || d.model === RF.model); });
    var worked = ds.length || ['deal', 'shoot', 'published'].indexOf(p.stage) !== -1;
    if (!worked) return;
    if (RF.model && !ds.length) return;
    var dsR = ds.filter(function (d) { return (!d.start || d.start <= b) && (!d.end || d.end >= a); });
    var cs = (S.CP[p.id] || []).filter(function (c) { return S.D[c.did] && ds.indexOf(S.D[c.did]) !== -1 && inR(c.date); });
    var base = RF.per === 'all' ? ds.reduce(function (s, d) { return s + (d.items || []).reduce(function (x, it) { return x + (Number(it.base) || 0); }, 0); }, 0) : 0;
    var paid = 0, open = 0, unk = 0, committed = 0;
    ds.forEach(function (d) {
      (S.KB[d.id] || []).forEach(function (k) {
        if (k.st === 'paid' && (RF.per === 'all' || inR(k.paidAt || k.due))) paid += payPaidAmt(k);
        if (payOpen(k)) open += +k.amount || 0;
        if (k.st === 'unk') unk += +k.amount || 0;
      });
      if (dsR.indexOf(d) !== -1) committed += calc(d).total || 0;
    });
    if (RF.per !== 'all' && !dsR.length && !cs.length && !paid) return;
    var starts = ds.map(function (d) { return d.start; }).filter(Boolean).sort(), ends = ds.map(function (d) { return d.end; }).filter(Boolean).sort();
    var lastC = (S.CP[p.id] || []).map(function (c) { return c.date; }).sort().pop() || '';
    rows.push({ p: p, ds: ds, active: ds.filter(function (d) { return d.status === 'active'; }).length, models: ds.map(function (d) { return d.model; }),
                content: cs.length + base, paid: paid, open: open, unk: unk, committed: committed, from: starts[0] || '', to: ends[ends.length - 1] || '', lastC: lastC });
  });
  var q = nameKey(RF.q);
  if (q) rows = rows.filter(function (r) { return nameKey(r.p.name).indexOf(q) !== -1; });
  rows.sort(function (x, y) {
    if (RF.sort === 'content') return y.content - x.content;
    if (RF.sort === 'name') return x.p.name.localeCompare(y.p.name);
    if (RF.sort === 'recent') return (y.lastC || y.to || '') < (x.lastC || x.to || '') ? -1 : 1;
    return y.paid - x.paid || y.content - x.content;
  });
  return { rows: rows, a: a, b: b };
}
function repPeriodLabel() {
  var R = repRange();
  return RF.per === 'all' ? 'শুরু থেকে আজ পর্যন্ত' : dLabel(R[0]) + ' – ' + dLabel(R[1]);
}
function reportPage() {
  var D = repData(), rows = D.rows;
  var tot = rows.reduce(function (s, r) { s.content += r.content; s.paid += r.paid; s.open += r.open; s.deals += r.ds.length; s.active += r.active ? 1 : 0; return s; }, { content: 0, paid: 0, open: 0, deals: 0, active: 0 });
  // ধরন অনুযায়ী
  var byM = {}; rows.forEach(function (r) { r.ds.forEach(function (d) { var k = d.model || ''; byM[k] = byM[k] || { n: 0, paid: 0 }; byM[k].n++; (S.KB[d.id] || []).forEach(function (x) { if (x.st === 'paid' && (RF.per === 'all' || ((x.paidAt || x.due || '') >= D.a && (x.paidAt || x.due || '') <= D.b))) byM[k].paid += payPaidAmt(x); }); }); });
  // মাস অনুযায়ী (শেষ ১২ মাস বা সময়ের ভেতরে)
  var endM = (D.b > today() ? today() : D.b).slice(0, 7), months = [];
  for (var i = 11; i >= 0; i--) { var m = mAdd(endM, -i); if (m + '-31' >= D.a) months.push(m); }
  var mc = months.map(function (m) { return S.works.filter(function (w) { return w.month === m; }).length; });
  var mp = months.map(function (m) { return S.pays.filter(function (k) { return k.st === 'paid' && String(k.paidAt || k.due || '').slice(0, 7) === m; }).reduce(function (s, k) { return s + payPaidAmt(k); }, 0); });
  var mxC = Math.max.apply(null, [1].concat(mc)), mxP = Math.max.apply(null, [1].concat(mp));
  return '<div class="ponly prhead"><b>' + esc(S.set.org || ORG) + '</b><span>পিআর ও ক্রিয়েটর পার্টনারশিপ — কাজের রিপোর্ট</span><small>' + repPeriodLabel() + ' · তৈরি ' + dLabel(today()) + '</small></div>' +

function repCsv() {
  var D = repData();
  var head = ['ক্রিয়েটর', 'ধরন', 'বিষয়', 'চুক্তি সংখ্যা', 'চুক্তির ধরন', 'শুরু', 'শেষ', 'কনটেন্ট পাওয়া', 'শেষ কনটেন্ট', 'টাকা দেওয়া', 'বাকি', 'অজানা', 'ফোন', 'ইমেইল'];
  var q = function (v) { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  var lines = [head.join(',')].concat(D.rows.map(function (r) {
    return [r.p.name, KINDS[r.p.kind] || '', r.p.cat || '', r.ds.length, r.models.map(function (m) { return (MODELS[m] || {}).s || 'ঠিক নেই'; }).join(' + '), r.from, r.to,
            r.content, r.lastC, Math.round(r.paid), Math.round(r.open), Math.round(r.unk), r.p.phone || '', r.p.email || ''].map(q).join(',');
  }));
  var blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'PR-Desk-report-' + today() + '.csv'; document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  window.__lastCsv = lines;
}
