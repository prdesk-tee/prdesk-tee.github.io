<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PR Desk</title>
<meta name="theme-color" content="#0c0c10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PR Desk">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<script>
/* =========================================================
 *  PR Desk — creators, agencies, TV & ad partners: contracts, payments, content, discovery
 *  API_URL = PR Desk Apps Script ("Anyone" deployment) /exec link.
 *  The page is public and holds no data; security = login token + PIN.
 * ========================================================= */
var API_URL = 'https://script.google.com/macros/s/AKfycbz-eFPmsINRONgL5PkZHPvcUkTMDTer9fTqCCoHNsN-T-ahE8VN_4afqinI2DEHr-A/exec';

// github.io origins can share storage — every key starts with "prd_"
var AUTH_KEY = 'prd_auth', BOOT_KEY = 'prd_boot_v2';
var AUTH = '';
try { AUTH = localStorage.getItem(AUTH_KEY) || ''; } catch (e) {}
function setAuth(t) {
  AUTH = t || '';
  try { if (AUTH) localStorage.setItem(AUTH_KEY, AUTH); else { localStorage.removeItem(AUTH_KEY); localStorage.removeItem(BOOT_KEY); } } catch (e) {}
}

/* ভাষা: ইংরেজি মূল, বাংলা ঐচ্ছিক (এই ডিভাইসে মনে থাকে) */
var LANG = 'en';
try { LANG = localStorage.getItem('prd_lang') === 'bn' ? 'bn' : 'en'; } catch (e) {}
document.documentElement.lang = LANG;

var THEME = 'dark';
try { THEME = localStorage.getItem('prd_theme2') || 'dark'; } catch (e) {}
function applyTheme() {
  var t = THEME === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : THEME;
  document.documentElement.setAttribute('data-theme', t);
}
applyTheme();

var ORG = 'Technique Easy Education';
try { var _b = JSON.parse(localStorage.getItem(BOOT_KEY) || 'null'); if (_b && _b.data && _b.data.set) ORG = _b.data.set.org || ORG; } catch (e) {}

/* text/plain POST — no preflight; give up after 45 s */
function callServer(fn, args) {
  var ctl = window.AbortController ? new AbortController() : null;
  var tm = ctl ? setTimeout(function () { ctl.abort(); }, 45000) : 0;
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fn, args: args || [], auth: AUTH }),
    signal: ctl ? ctl.signal : undefined
  }).then(function (r) {
    clearTimeout(tm);
    if (!r.ok) throw new Error((LANG === 'bn' ? 'সার্ভার সাড়া দিচ্ছে না' : 'Server not responding') + ' (' + r.status + ')');
    return r.json().catch(function () { throw new Error(LANG === 'bn' ? 'সার্ভারের উত্তর বোঝা যায়নি।' : 'Could not read the server reply.'); });
  }, function () {
    clearTimeout(tm);
    throw new Error(LANG === 'bn' ? 'সার্ভারে পৌঁছানো যায়নি — ইন্টারনেট দেখুন।' : 'Could not reach the server — check your internet.');
  }).then(function (j) {
    if (!j || !j.ok) throw new Error((j && j.error) || 'Unknown error.');
    return j.data;
  });
}

/* ব্যক্তিগত লোগো "Matra Logic" — Developed By-এর সামনে */
function markSvg(cls) {
  return '<svg class="mk ' + (cls || '') + '" viewBox="0 0 100 100" aria-hidden="true">' +
    '<path d="M8 18H92M16 88 40 18 64 88" fill="none" stroke="url(#mkg)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<path d="M84 18V88" fill="none" stroke="url(#mkg)" stroke-width="9" stroke-linecap="round"/>' +
    '<circle cx="40" cy="64" r="7.5" fill="url(#mkg)"/></svg>';
}
</script>
<style>
:root{
  --f:'Noto Sans Bengali','Segoe UI',system-ui,sans-serif;
  --bg:#f5f5f8;--side:#ffffff;--card:#ffffff;--card2:#f8f8fb;--line:#ebebf0;--hover:#f6f6f9;
  --ink:#16161c;--ink2:#4a4a57;--ink3:#8a8a98;
  --acc:#db2777;--acc-d:#be185d;--acc-s:rgba(219,39,119,.08);--grad:linear-gradient(135deg,#f43f5e,#ec4899 45%,#8b5cf6);
  --pos:#059669;--pos-s:rgba(5,150,105,.1);--warn:#d97706;--warn-s:rgba(217,119,6,.1);--neg:#dc2626;--neg-s:rgba(220,38,38,.08);--info:#2563eb;--info-s:rgba(37,99,235,.08);
  --sh:0 1px 2px rgba(20,20,30,.04);--sh2:0 18px 50px rgba(20,20,30,.16);--top:rgba(245,245,248,.88);--r:18px;
  --m1:#6366f1;--m2:#8b5cf6;--m3:#d946ef;
}
[data-theme=dark]{
  --bg:#0c0c10;--side:#111116;--card:#16161c;--card2:#1b1b22;--line:#25252e;--hover:#1a1a21;
  --ink:#f2f2f6;--ink2:#b9b9c6;--ink3:#7e7e8c;
  --acc:#f0509a;--acc-d:#e23d89;--acc-s:rgba(240,80,154,.12);
  --pos:#34d399;--pos-s:rgba(52,211,153,.12);--warn:#fbbf24;--warn-s:rgba(251,191,36,.12);--neg:#f87171;--neg-s:rgba(248,113,113,.12);--info:#60a5fa;--info-s:rgba(96,165,250,.12);
  --sh:0 1px 2px rgba(0,0,0,.3);--sh2:0 24px 60px rgba(0,0,0,.55);--top:rgba(12,12,16,.88);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f);font-size:14.5px;line-height:1.55;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
[hidden]{display:none!important}
a{color:inherit;text-decoration:none}
a.lnk-a{color:var(--acc)}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.s{width:15px;height:15px}
.mk{width:18px;height:18px;flex:none}
.muted{color:var(--ink3)}
.nw{white-space:nowrap}
.neg{color:var(--neg)}.pos{color:var(--pos)}.warn{color:var(--warn)}

/* ---------- login ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
  background:radial-gradient(circle at 18% 14%,#be185d 0,transparent 45%),radial-gradient(circle at 86% 90%,#6d28d9 0,transparent 42%),#0c0c10}
.lg-card{width:100%;max-width:370px;background:#fff;color:#16161c;border-radius:24px;padding:30px 22px 20px;box-shadow:0 24px 60px rgba(0,0,0,.45);text-align:center}
.lg-card .ic0{width:72px;height:72px;border-radius:20px;display:block;margin:0 auto 12px}
.lg-card h1{font:800 22px 'Plus Jakarta Sans',sans-serif;letter-spacing:-.02em;margin-bottom:2px}
.lg-card .sub{font-size:13.5px;color:#71717a;margin-bottom:20px}
.lg-card label{display:block;text-align:left;font-size:13px;font-weight:600;color:#3f3f46;margin:0 0 5px}
.lg-card input{width:100%;padding:13px 14px;border:2px solid #ececf0;border-radius:13px;font-size:16px;font-weight:600;outline:none;color:#16161c;background:#fff}
.lg-card input:focus{border-color:#db2777;box-shadow:0 0 0 3px rgba(219,39,119,.15)}
.lg-card input.code{letter-spacing:8px;text-align:center;font-size:22px}
.lg-btn{width:100%;margin-top:12px;padding:14px;border-radius:13px;color:#fff;font-size:15.5px;font-weight:700;background:linear-gradient(135deg,#f43f5e,#ec4899 45%,#8b5cf6)}
.lg-btn:disabled{opacity:.6;cursor:wait}
.lg-msg{min-height:20px;margin-top:10px;font-size:13px;font-weight:600;color:#c0392b;line-height:1.5}
.lg-msg.ok{color:#2d6a4f}
.lg-link{color:#db2777;font-size:13px;font-weight:700;margin-top:8px}

/* ---------- shell ---------- */
.shell{min-height:100vh}
.side{display:none}
.topbar{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:var(--top);border-bottom:1px solid var(--line)}
.topbar-in{padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:11px;min-width:0;flex:1}
.brand img{width:36px;height:36px;border-radius:11px;flex:none}
.brand b{display:block;font:800 16px 'Plus Jakarta Sans',sans-serif;letter-spacing:-.02em;line-height:1.2}
.brand small{display:block;font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{height:38px;min-width:38px;padding:0 9px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:none;font-size:13px;font-weight:600}
.menu{position:absolute;right:16px;top:56px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh2);padding:6px;min-width:220px;z-index:30}
.menu button{display:flex;gap:10px;align-items:center;width:100%;color:var(--ink);padding:10px 12px;border-radius:9px;text-align:left}
.menu button:hover{background:var(--hover)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
main{padding:18px 16px 110px;max-width:1360px;margin:0 auto}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(5,1fr);background:var(--side);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bnav button{color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;border-radius:12px;font-size:11px;font-weight:600;position:relative;white-space:nowrap}
.bnav button .ic{width:21px;height:21px}
.bnav button.on{color:var(--acc)}
.nb{min-width:19px;height:19px;border-radius:99px;background:var(--neg);color:#fff;font-size:11.5px;font-weight:700;line-height:19px;padding:0 6px;text-align:center}
.bnav .nb{position:absolute;top:0;right:calc(50% - 22px)}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:26;width:54px;height:54px;border-radius:18px;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:0 10px 26px rgba(236,72,153,.35)}
.fab .ic{width:26px;height:26px;stroke-width:2.2}
.dev-foot{display:flex;align-items:center;justify-content:center;gap:7px;font-size:12px;color:var(--ink3);margin:30px 0 4px}
.dev-foot b{font:800 12.5px 'Plus Jakarta Sans',sans-serif;color:var(--ink2)}
@media(min-width:1000px){
  .shell{display:grid;grid-template-columns:248px 1fr}
  .side{display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh;padding:22px 16px 14px;border-right:1px solid var(--line);background:var(--side);overflow-y:auto;scrollbar-width:thin}
  .side .brand{flex:none;padding:0 6px 20px}
  .side .brand .logo{width:38px;height:38px;border-radius:12px}
  .side .cta{flex:none;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--grad);color:#fff;border-radius:13px;padding:11px;font-weight:600;margin-bottom:16px;box-shadow:0 10px 26px rgba(236,72,153,.28)}
  .side .nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--ink2);font-weight:500;text-align:left;flex:none}
  .side .nav:hover{background:var(--hover)}
  .side .nav.on{background:var(--acc-s);color:var(--acc);font-weight:600}
  .side .nav .nb{margin-left:auto}
  .side .lang{margin-top:auto}
  .side .s-tools{display:flex;gap:4px;padding:10px 0 0;border-top:1px solid var(--line);margin-top:12px;flex:none}
  .side .s-tools button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink2);padding:8px 0;border-radius:10px;font-size:13px}
  .side .s-tools button:hover,.side .s-tools button.on{background:var(--hover);color:var(--ink)}
  .side .s-foot{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink3);padding:10px 6px 0;white-space:nowrap;flex:none}
  .side .s-foot b{font:800 11.5px 'Plus Jakarta Sans',sans-serif;color:var(--ink2)}
  .topbar,.bnav,.fab,.dev-foot{display:none}
  main{padding:28px 36px 60px}
}
.lang{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;flex:none}
.lang button{flex:1;padding:7px 0;border-radius:9px;font-size:13px;color:var(--ink2)}
.lang button.on{background:var(--acc-s);color:var(--acc);font-weight:600}

/* ---------- common ---------- */
.top{display:flex;align-items:flex-end;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.top .grow{flex:1;min-width:220px}
.top h1{font-size:25px;font-weight:700;line-height:1.3;letter-spacing:-.01em}
.top p{font-size:13.5px;color:var(--ink3);margin-top:2px}
.top .acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border-radius:11px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:13.5px;white-space:nowrap;transition:background .15s,border-color .15s;color:var(--ink)}
.btn:hover{background:var(--hover)}
.btn.pri{background:#db2777;border-color:transparent;color:#fff}
.btn.pri:hover{background:#be185d}
.btn.grad{background:var(--grad);border:0;color:#fff}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
.btn.xs{padding:4px 9px;font-size:12px;border-radius:8px;gap:5px}
.btn.ok{color:var(--pos)}
.btn.red{color:var(--neg)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink2)}
.btn.ghost:hover{background:var(--hover)}
.btn.w{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:16px}
.cpad{padding:18px 20px}
.ch{display:flex;align-items:center;gap:10px;padding:18px 20px 8px;flex-wrap:wrap}
.ch h3{font-size:15.5px;font-weight:700}
.ch .c{font-size:12px;color:var(--ink3);background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:0 8px}
.ch .grow{flex:1}
.ch a,.ch .lk2{font-size:13px;color:var(--ink3)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--card2);color:var(--ink2);white-space:nowrap}
.pill.ok{background:var(--pos-s);color:var(--pos)}.pill.warn{background:var(--warn-s);color:var(--warn)}.pill.bad{background:var(--neg-s);color:var(--neg)}.pill.info{background:var(--info-s);color:var(--info)}.pill.acc{background:var(--acc-s);color:var(--acc)}
.mdl{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:7px;white-space:nowrap}
.m-upfront{background:var(--pos-s);color:var(--pos)}.m-install{background:var(--info-s);color:var(--info)}.m-per{background:var(--acc-s);color:var(--acc)}.m-one{background:var(--warn-s);color:var(--warn)}.m-none{background:var(--neg-s);color:var(--neg)}
.empty{text-align:center;padding:34px 16px;color:var(--ink3);font-size:14px;line-height:1.6}
.empty .ic{width:30px;height:30px;display:block;margin:0 auto 8px;opacity:.6}
.err{padding:12px 14px;border-radius:12px;background:var(--neg-s);color:var(--neg);font-size:13.5px;line-height:1.5;margin-bottom:12px}
.note{padding:11px 13px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:13px;color:var(--ink2);line-height:1.6}
.note.warn{background:var(--warn-s);border-color:transparent;color:var(--warn)}
.bar{height:6px;border-radius:99px;background:var(--card2);overflow:hidden}
[data-theme=dark] .bar{background:#24242c}
.bar i{display:block;height:100%;border-radius:99px;background:var(--grad)}
.bar.ok i{background:var(--pos)}.bar.time i{background:var(--ink3)}.bar.bad i{background:var(--neg)}
.more{display:block;width:100%;color:var(--ink2);font-weight:600;font-size:13px;padding:12px 0;text-align:center;border-top:1px solid var(--line)}
.more:hover{color:var(--acc)}
.sk{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--card2),var(--line),var(--card2));background-size:200% 100%;animation:sh 1.3s infinite;margin:10px 0}
@keyframes sh{to{background-position:-200% 0}}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#16161c;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:92vw;text-align:center;display:flex;gap:10px;align-items:center;pointer-events:none;border:1px solid #2a2a33}
.toast button{pointer-events:auto;background:rgba(255,255,255,.14);color:#fff;border-radius:8px;padding:5px 10px;font-weight:700;font-size:13px}
@media(min-width:1000px){.toast{bottom:28px}}
.tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink2);font-size:13.5px;font-weight:500;white-space:nowrap}
.tabs button em{font-style:normal;color:var(--ink3);margin-left:6px;font-size:12px}
.tabs button.on{background:var(--acc-s);border-color:color-mix(in srgb,var(--acc) 45%,transparent);color:var(--acc);font-weight:600}
.tabs button.on em{color:var(--acc)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.srch{position:relative;flex:1 1 240px}
.srch .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.srch .in{padding-left:38px}
.in,.sel{width:100%;min-width:0;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s}
.in:focus,.sel:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-s)}
.in::placeholder{color:var(--ink3)}
textarea.in{resize:vertical;min-height:90px;line-height:1.6}
.tools .sel{width:auto;flex:0 1 200px}
.fl{display:block;font-size:12px;font-weight:600;color:var(--ink3);margin:14px 0 6px}
.fl em{font-style:normal;font-weight:400}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{padding:7px 12px;border-radius:9px;font-size:13px;color:var(--ink2);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18);font-weight:600}
[data-theme=dark] .seg button.on{background:#2a2a33}
.seg.full{display:flex}.seg.full button{flex:1}
.sw{position:relative;width:42px;height:24px;border-radius:99px;background:#c9c9d2;flex:none;transition:background .2s}
[data-theme=dark] .sw{background:#3a3a44}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:var(--acc)}.sw.on::after{left:21px}
.swrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px dashed var(--line)}
.swrow span{flex:1}.swrow small{display:block;font-size:12.5px;color:var(--ink3)}

/* ---------- rows ---------- */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{padding:18px 20px;margin:0;text-align:left;color:var(--ink);display:block;width:100%}
button.kpi:hover{border-color:color-mix(in srgb,var(--acc) 40%,var(--line))}
.kpi small{display:block;font-size:13px;color:var(--ink3)}
.kpi b{display:block;font-size:27px;font-weight:700;margin-top:4px;line-height:1.3}
.kpi b em{font-style:normal;font-size:14px;color:var(--ink3);font-weight:500}
.kpi .sub{font-size:12.5px;color:var(--ink3)}
.kpi.bad b{color:var(--neg)}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}

/* ---------- tables ---------- */

.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin-top:4px}

.sheet.wide{max-width:1100px}

.was{display:block;font-size:11.5px;color:var(--warn);margin-top:4px}

.itbl{width:100%;border-collapse:collapse;margin-top:6px}

.itbl td{padding:4px 3px}
.itbl .in,.itbl .sel{padding:8px 9px;font-size:13.5px;border-radius:9px}
.itbl .x{color:var(--ink3);padding:4px 6px}
.itbl .x:hover{color:var(--neg)}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

.presets button:hover{border-color:var(--acc);color:var(--acc)}
.gen{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:8px;align-items:end;padding:12px;border-radius:12px;background:var(--card2);border:1px solid var(--line);margin-top:8px}
.gen .fl{margin-top:0}
.sumline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-top:8px}
.linkin{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:center;margin-top:8px}

.newm{display:flex;flex-direction:column;gap:8px;padding:8px 0 4px}

/* ক্রিয়েটরের অবস্থা — চুক্তি দেখে নিজে: চলতি চুক্তি = Active; আগের চুক্তি/কাজ = Worked before;

/* ---------- টাকার হিসাব ---------- */
function payOpen(k) { return k.st === 'due' || k.st === 'req'; }
function payLive(k) { var d = S.D[k.did]; return d && d.status !== 'cancel'; }
function payOver(k) { return payOpen(k) && k.due && k.due < today(); }
function payAmt(k) { return k.st === 'paid' ? (num(k.paidAmt) || num(k.amount)) : num(k.amount); }

/* চুক্তির মাস — মেয়াদের দৈর্ঘ্য ধরে (৯ নভে – ৮ নভে = ১২ মাস); শেষ না থাকলে ১২ */
function dealMonths(d) {
  if (!d.start) return [];
  var n = d.end && d.end >= d.start ? Math.max(1, Math.round((dd(d.start, d.end) + 1) / 30.44)) : 12, out = [], m = d.start.slice(0, 7);

  return out;
}
/* একটা চুক্তির হিসাব — কনটেন্ট, টাকা, মেয়াদ, কী দেওয়া নেই */
function calc(d) {
  var cs = S.CB[d.id] || [], ks = S.KB[d.id] || [], td = today(), cm = td.slice(0, 7), items = d.items || [];

  var base = items.reduce(function (s, it) { return s + num(it.base); }, 0);
  o.got = base + cs.length;
  o.items = items.map(function (it) { return { k: it.k, name: it.name, qty: num(it.qty), where: it.where, got: num(it.base) + cs.filter(function (c) { return c.item === it.k; }).length }; });
  if (d.plan === 'month') {
    o.perM = items.reduce(function (s, it) { return s + num(it.qty); }, 0);
    o.months = dealMonths(d).map(function (m) {
      var mc = cs.filter(function (c) { return c.month === m; });
      var st = m > cm ? 'future' : mc.length >= o.perM ? 'ok' : m === cm ? 'cur' : 'short';
      if (st === 'short' && d.status === 'active') o.short += o.perM - mc.length;
      var r = { m: m, exp: o.perM, got: mc.length, cs: mc, st: st }; if (m === cm) o.cur = r; return r;

    var a = num(k.amount);

  });
  o.total = d.model === 'per' ? num(d.rate) * (o.exp || 0) : (num(d.total) || ks.reduce(function (s, k) { return s + num(k.amount); }, 0));
  var ms = dealMonths(d); o.mTotal = ms.length; o.mGone = ms.filter(function (m) { return m <= cm; }).length;

    if (!d.start) o.missing.push(t('start date'));
    if (!items.length && !o.ad && d.model !== 'install' && d.model !== 'upfront') o.missing.push(t('deliverables'));
    if (d.model === 'per' && !num(d.rate)) o.missing.push(t('amount per content'));
    if (d.model && d.model !== 'per' && !num(d.total) && !ks.length) o.missing.push(t('amount'));
    if (ks.some(function (k) { return payOpen(k) && !k.due; })) o.missing.push(t('payment dates'));
  }
  return o;
}

/* পুরনো তথ্য গোছানোর তালিকা — আজকের কাজে মেশে না */

/* চুক্তির কার্ড — কী কী দেবেন | টাকা | পাওয়া কাজ */
function dealBlock(d, inPast) {
  var c = calc(d), td = today();
  var term = d.start ? dLong(d.start) + ' – ' + (d.end ? dLong(d.end) : t('open-ended')) : t('No term set');
  var head = '<div class="ch" id="deal-' + esc(d.id) + '"><h3>' + esc(d.title) + '</h3>' + mdl(d.model) + '<span class="muted" style="font-size:13px">' + term + (c.total ? ' · ' + tk(c.total) + (d.model === 'per' ? ' (' + t('est.') + ')' : '') : '') + '</span>' +
    (d.status !== 'active' ? '<span class="pill">' + t(DST[d.status]) + '</span>' : c.ended ? '<span class="pill bad">' + t('Term ended') + '</span>' : '') + '<span class="grow"></span>' +
    '<button class="btn sm" data-a="ag-new" data-did="' + esc(d.id) + '">' + icon('pen', 's') + t('Agreement paper') + '</button>' +
    (d.status === 'active' ? '<button class="btn sm" data-a="renew" data-id="' + esc(d.id) + '">' + icon('renew', 's') + t('Renew') + '</button>' : '') +
    '<button class="btn sm ghost" data-a="deal-edit" data-id="' + esc(d.id) + '">' + t('Edit') + '</button>' +
    (d.status === 'active' ? '<button class="btn sm ghost" data-a="deal-st" data-id="' + esc(d.id) + '" data-v="done">' + t('Mark ended') + '</button>' : '<button class="btn sm ghost" data-a="deal-st" data-id="' + esc(d.id) + '" data-v="active">' + t('Reopen') + '</button>') + '</div>';
  if (c.missing.length) head += '<div style="padding:0 20px 10px"><div class="note warn">' + t('Missing: {0}', c.missing.join(', ')) + ' — <a href="#" class="lnk-a" data-a="deal-edit" data-id="' + esc(d.id) + '">' + t('fill in') + '</a></div></div>';
  var prevD = d.prev ? S.D[d.prev] : null, nextD = S.deals.filter(function (x) { return x.prev === d.id; })[0];
  if (prevD || nextD) head += '<div style="padding:0 20px 10px;font-size:12.5px" class="muted">' + icon('renew', 's') + ' ' + (prevD ? t('Renewal of {0}', '<a class="lnk-a" href="#p/' + esc(d.pid) + '/' + esc(prevD.id) + '">' + esc(prevD.title) + '</a>') : '') + (nextD ? (prevD ? ' · ' : '') + t('Renewed as {0}', '<a class="lnk-a" href="#p/' + esc(d.pid) + '/' + esc(nextD.id) + '">' + esc(nextD.title) + '</a>') : '') + '</div>';
  // কী কী দেবেন
  var del = '';
  if (c.ad) del = adDeliverables(d, c);
  else if (d.plan === 'month' && c.months.length) {
    del += '<div class="mgrid">' + c.months.map(function (r) {
      var slots = r.cs.map(function (x) { return '<button class="slot got" data-a="content-edit" data-id="' + esc(x.id) + '" title="' + esc(x.title || '') + '">✓</button>'; }).join('');
      for (var i = r.got; i < r.exp; i++) slots += r.st === 'future' || d.status !== 'active' ? '<span class="slot"></span>' : '<button class="slot" data-a="content-new" data-did="' + esc(d.id) + '" data-m="' + r.m + '" title="' + t('Add content') + '">+</button>';
      return '<div class="mo ' + r.st + '"><div class="mh">' + mShort(r.m) + '<span>' + (r.st === 'ok' ? '✓' : r.st === 'future' ? '' : N(r.got) + '/' + N(r.exp)) + '</span></div><div class="slots">' + slots + '</div></div>';
    }).join('') + '</div>';
    if (c.items.length > 1) del += '<div style="margin-top:10px">' + c.items.map(function (i) { return '<div class="sc"><span>' + esc(i.name) + '</span><b>' + t('{0} a month', N(i.qty)) + '</b></div>'; }).join('') + '</div>';
  } else if (c.items.length) {
    del = c.items.map(function (i) {
      var w = i.qty > 0 ? Math.min(100, Math.round(i.got / i.qty * 100)) : (i.got ? 100 : 0);
      return '<div class="sc"><span>' + esc(i.name) + '</span><b>' + N(i.got) + (i.qty > 0 ? '/' + N(i.qty) : '') + '</b>' + (i.qty > 0 ? '<div class="bar' + (i.got >= i.qty ? ' ok' : '') + '"><i style="width:' + w + '%"></i></div>' : '<small>' + t('as needed') + (i.where ? ' · ' + esc(i.where) : '') + '</small>') + (i.qty > 0 && i.where ? '<small>' + esc(i.where) + '</small>' : '') + '</div>';
    }).join('');
  } else del = '<div class="muted" style="font-size:13px">' + (d.model === 'install' || d.model === 'upfront' ? t('Not applicable') : t('Not set')) + '</div>';
  if (c.mTotal && !c.ad) del += '<div class="sc" style="margin-top:6px"><span class="muted">' + t('Term') + '</span><b>' + t('{0}/{1} months', N(c.mGone), N(c.mTotal)) + '</b><div class="bar time"><i style="width:' + Math.round(c.mGone / c.mTotal * 100) + '%"></i></div></div>';
  // টাকা
  var money = c.ks.length ? c.ks.map(function (k) {
    var ck = k.st === 'paid' ? '<span class="ck ok">✓</span>' : k.st === 'unk' ? '<span class="ck unk"></span>' : k.st === 'req' ? '<span class="ck req">↗</span>' : payOver(k) ? '<span class="ck bad"></span>' : '<span class="ck no"></span>';
    var tag = k.st === 'unk' ? ' <span class="pill warn">' + t('Verify') + '</span>' : payOver(k) ? ' <span class="pill bad">' + t('Overdue') + '</span>' : k.st === 'req' ? ' <span class="pill info">' + t('With accounts') + '</span>' : '';
    return '<div class="ki click" data-a="pay-open" data-id="' + esc(k.id) + '" style="cursor:pointer">' + ck + '<div class="g">' + esc(lbl(k.label)) + tag + '<small>' + (k.st === 'paid' ? t('Paid {0}', k.paidAt ? dShort(k.paidAt) : '') : k.due ? dShort(k.due) : t('no date')) + '</small></div><b>' + tk(payAmt(k)) + '</b></div>';
  }).join('') : '<div class="muted" style="font-size:13px">' + (d.model === 'per' ? t('Each content adds {0} here.', tk(d.rate)) : t('No payments set.')) + '</div>';
  // পাওয়া কাজ (বিজ্ঞাপনে: মাসের প্রমাণ)
  var got = c.ad ? adProofs(d, c) : (c.cs.length ? c.cs.slice(0, S.open['cs' + d.id] ? 200 : 5).map(function (x) {
    var it = (d.items || []).filter(function (i) { return i.k === x.item; })[0], fk = Object.keys(x.links || {})[0];
    return '<div class="ki">' + (fk ? plIcon(fk) : plIcon('drv')) + '<div class="g click" data-a="content-edit" data-id="' + esc(x.id) + '" style="cursor:pointer">' + esc(x.title || (it ? it.name : t('Content'))) + '<small>' + dShort(x.date) + (d.plan === 'month' ? ' · ' + mShort(x.month) : '') + '</small></div>' + workLinks(x) + '</div>';
  }).join('') + (c.cs.length > 5 ? '<button class="btn xs ghost" data-a="more" data-k="cs' + esc(d.id) + '">' + (S.open['cs' + d.id] ? t('Show less') : t('Show all {0}', N(c.cs.length))) + '</button>' : '')
    : '<div class="muted" style="font-size:13px">' + (c.got ? t('{0} received before (no links)', N(c.got)) : t('Nothing yet.')) + '</div>') +
    (d.status === 'active' ? '<button class="btn sm pri w" style="margin-top:10px" data-a="content-new" data-did="' + esc(d.id) + '">' + icon('plus', 's') + t('Add content') + '</button>' : '');
  return '<div class="' + (inPast ? '' : 'card') + '" style="' + (inPast ? 'border-top:1px solid var(--line)' : 'margin-bottom:16px') + '">' + head +
    '<div class="deal3"><div><h4>' + (c.ad ? t('Ad airtime') : t('Deliverables')) + '</h4>' + del + '</div>' +
    '<div><h4>' + t('Payments') + ' · <span>' + t('{0} paid, {1} due', tkS(c.paid), tkS(c.open + c.unk)) + '</span></h4>' + money + '</div>' +
    '<div><h4>' + (c.ad ? t('Proof each month') + ' · <span>' + t('{0} of {1}', N(c.pm.filter(function (r) { return r.w; }).length), N(c.pm.filter(function (r) { return r.st !== 'future'; }).length)) + '</span>' : t('Received') + ' · <span>' + N(c.got) + '</span>') + '</h4>' + got + '</div></div>' +
    (d.note ? '<div style="padding:0 20px 16px"><div class="note">' + esc(d.note).replace(/\n/g, '<br>') + '</div></div>' : '') + '</div>';
}

/* ═════════════════════════ PR Desk — creator photos ═════════════════════════
 * উৎস: YouTube চ্যানেলের ছবি, Facebook পেজের ছবি (দুটোই অফিসিয়াল), নাহলে নিজে আপলোড বা ছবির লিংক।
 * ছবি ১৬০px JPEG করে সার্ভারের PHOTOS শিটে; এই ডিভাইসে prd_photos-এ জমা থাকে, শুধু বদলগুলো আসে। */
var PH = {}, PH_KEY = 'prd_photos', PH_TRIED = {}, PH_BULK = null;
var PH_SRC = { youtube: 'From YouTube', facebook: 'From Facebook', upload: 'Uploaded', link: 'From an image link', manual: 'Added by you' };

function phCache() { try { return JSON.parse(localStorage.getItem(PH_KEY) || '{}') || {}; } catch (e) { return {}; } }
function phSaveCache(c) { try { localStorage.setItem(PH_KEY, JSON.stringify(c)); } catch (e) {} }
/* ক্যাশ থেকে সঙ্গে সঙ্গে, তারপর নতুন/বদলানোগুলো সার্ভার থেকে */
function loadPhotos() {
  var c = phCache(), need = [], keep = {};
  Object.keys(S.PI || {}).forEach(function (id) {
    var x = S.PI[id];
    if (x.src === 'none') return;
    if (c[id] && c[id].at === x.at) { PH[id] = c[id].d; keep[id] = c[id]; } else need.push(id);
  });
  Object.keys(PH).forEach(function (id) { if (!S.PI[id] || S.PI[id].src === 'none') delete PH[id]; });
  refreshAv();
  if (!need.length) { phSaveCache(keep); return; }
  var step = function (i) {
    if (i >= need.length || !AUTH) { phSaveCache(keep); return; }
    callServer('apiPhotos', [need.slice(i, i + 60)]).then(function (r) {
      Object.keys(r).forEach(function (id) { if (r[id].d) { PH[id] = r[id].d; keep[id] = { at: r[id].at, d: r[id].d }; } });
      refreshAv(); step(i + 60);
    }, function () { phSaveCache(keep); });
  };
  step(0);
}
/* পাতা আবার না এঁকে শুধু গোল ছবিগুলো বদলানো */
function refreshAv() {
  document.querySelectorAll('.av[data-pid]').forEach(function (e) {
    var id = e.getAttribute('data-pid'), d = PH[id], img = e.querySelector('img');
    if (d && (!img || img.getAttribute('src') !== d)) e.innerHTML = '<img src="' + d + '" alt="">';
    else if (!d && img) e.textContent = initials((S.P[id] || {}).name);
  });

/* যেকোনো ছবি → মাঝখান থেকে বর্গ কেটে ১৬০px JPEG */
function toJpeg(src, size) {
  size = size || 160;
  return new Promise(function (res, rej) {
    var im = new Image();
    im.onload = function () {
      var s = Math.min(im.naturalWidth, im.naturalHeight); if (!s) return rej(new Error(t('That file is not an image.')));
      var cv = document.createElement('canvas'); cv.width = cv.height = size;
      var x = cv.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, size, size);
      x.imageSmoothingQuality = 'high';
      x.drawImage(im, (im.naturalWidth - s) / 2, (im.naturalHeight - s) / 2, s, s, 0, 0, size, size);
      var d = cv.toDataURL('image/jpeg', 0.84);
      if (d.length > 45000) d = cv.toDataURL('image/jpeg', 0.6);
      res(d);
    };
    im.onerror = function () { rej(new Error(t('That file is not an image.'))); };
    im.src = src;
  });
}
function setPhoto(pid, data, src, btn) {

    S.PI[pid] = { at: r.at, src: r.src };
    S.photos = Object.keys(S.PI).map(function (id) { return [id, S.PI[id].at, S.PI[id].src]; });
    var c = phCache();
    if (data) { PH[pid] = data; c[pid] = { at: r.at, d: data }; } else { delete PH[pid]; delete c[pid]; }
    phSaveCache(c); saveBootCache(); refreshAv();
    return r;
  });
}
function canAuto(p) { return !!(p && (p.yt || p.fb || (p.more || []).some(function (m) { return /youtube\.com|youtu\.be|facebook\.com|fb\.com/i.test(m.u); }))); }
/* ক্রিয়েটরের YouTube/Facebook থেকে ছবি; silent = কিছু না পেলে চুপচাপ "চেষ্টা হয়েছে" লিখে রাখে */
function autoPhoto(pid, silent, btn) {
  if (btn) { btn.disabled = true; btn.dataset.l = btn.innerHTML; btn.innerHTML = t('Looking up…'); }
  var done = function () { if (btn) { btn.disabled = false; btn.innerHTML = btn.dataset.l; } };
  return callServer('apiPhotoSource', [{ pid: pid }]).then(function (img) {
    return toJpeg('data:' + img.mime + ';base64,' + img.b64).then(function (d) { done(); return setPhoto(pid, d, img.src).then(function () { return img.src; }); });
  }).catch(function (e) {
    done();
    if (/NO_PHOTO/.test(e.message)) { if (silent) return setPhoto(pid, '', 'none').then(function () { return ''; }, function () { return ''; }); toast(t('No photo found on their YouTube or Facebook. Upload one or paste an image link.'), 6000); return ''; }
    if (!silent) toast(srvMsg(e.message), 5000);
    return '';
  });
}

  if (!L.length) { toast(t('Everyone with a YouTube or Facebook link already has a photo.')); return; }

/* ═════════════════════════ PR Desk — contract form (one page), ads ═════════════════════════
 * মূল কথা: শুধু মূল তথ্য দিন — মেয়াদ, মোট টাকা, অগ্রিম, বাকিটা কয় কিস্তিতে কত মাস পরপর — কিস্তির তালিকা নিজে তৈরি।
 * না মিললে "আলাদা করে বদলান" দিয়ে যেকোনো লাইন হাতে। নবায়নে প্রতিটা ঘরের পাশে আগের মান। */
var AD_UNIT = { min: 'min', sec: 'sec', spots: 'times' };
var AD_PER = { hour: '{0} {1} per hour', day: '{0} {1} per day', week: '{0} {1} per week', month: '{0} {1} per month' };
function airtimeTxt(ad) { return ad && num(ad.qty) ? t(AD_PER[ad.per] || AD_PER.hour, N(ad.qty), t(AD_UNIT[ad.unit] || 'min')) : ''; }
function isAdDeal(d) { return !!(d && d.ad && num(d.ad.qty)); }
function monthsBetween(a, b) { var x = a.split('-'), y = b.split('-'); return (+y[0] - +x[0]) * 12 + (+y[1] - +x[1]); }
function termMonths(d) { return d.start && d.end && d.end >= d.start ? Math.max(1, Math.round((dd(d.start, d.end) + 1) / 30.44)) : 0; }
function freePays(id) { return (S.KB[id] || []).filter(function (k) { return !S.works.some(function (w) { return w.payId === k.id; }); }); }

/* পুরনো চুক্তির কিস্তি দেখে মূল তথ্য আন্দাজ (যাদের pplan নেই) */
function derivePlan(d, pays) {
  var P = { adv: 0, advPaid: false, advDate: '', n: d.model === 'install' ? 4 : 0, every: 3, first: '', mode: (pays[0] || {}).mode || S.set.payMode || 'acc' };
  if (!pays.length) return P;
  if (d.model !== 'install') { P.adv = num(pays[0].amount); P.advDate = pays[0].due || ''; P.advPaid = pays[0].st === 'paid'; P.n = 0; return P; }
  var f = pays[0], isAdv = /advance|অগ্রিম|upfront/i.test(f.label || '') || (pays.length > 2 && num(f.amount) !== num(pays[1].amount) && num(pays[1].amount) === num(pays[2].amount));
  var rest = isAdv ? pays.slice(1) : pays;
  if (isAdv) { P.adv = num(f.amount); P.advDate = f.due || ''; P.advPaid = f.st === 'paid'; }
  P.n = rest.length; P.first = (rest[0] || {}).due || '';
  P.every = rest.length > 1 && rest[0].due && rest[1].due ? Math.max(0, monthsBetween(rest[0].due, rest[1].due)) : 3;
  return P;
}
/* মূল তথ্য → কিস্তির তালিকা। আগের তালিকা থাকলে একই জায়গার লাইনের id আর অবস্থা (দেওয়া/হিসাবে) থাকে */
function buildPays() {
  var d = DF.d, P = DF.P, T = num(d.total), out = [], start = d.start || today();
  if (!d.model || d.model === 'per') return [];
  var inst = d.model === 'install', adv = inst ? Math.min(num(P.adv), T) : T;
  if (!inst || adv > 0) out.push({ kind: 'adv', label: d.model === 'upfront' ? 'Full amount (upfront)' : d.model === 'one' ? 'Full amount' : 'Advance', due: P.advDate || start, amount: adv });
  if (inst) {
    var rest = Math.max(0, T - adv), n = Math.max(rest > 0 ? 1 : 0, Math.round(num(P.n))), every = Math.max(0, Math.round(num(P.every)));
    var first = P.first || (adv > 0 ? addMonths(start, every || 1) : start), each = n ? Math.floor(rest / n) : 0;
    for (var i = 0; i < n; i++) out.push({ kind: 'inst', label: ordEn(i + 1) + ' installment', due: addMonths(first, i * every), amount: each + (i === n - 1 ? rest - each * n : 0) });
  }
  var base = DF.base || [];
  out.forEach(function (k, i) {
    var o = base[i];
    k.mode = P.mode || S.set.payMode || 'acc';
    if (o) { k.id = o.id; k.note = o.note; }
    if (k.kind === 'adv') k.st = P.advPaid ? 'paid' : (o && o.st === 'req' ? 'req' : 'due');
    else k.st = o && o.st !== 'unk' ? o.st : 'due';
  });
  return out;
}
function ordEn(n) { var s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
function samePays(a, b) {
  return a.length === b.length && a.every(function (k, i) { return Math.abs(num(k.amount) - num(b[i].amount)) <= 1 && (k.due || '') === (b[i].due || ''); });
}

function agDiff(a, b) {
  var A = String(a).split(/(\s+)/), Bt = String(b).split(/(\s+)/), n = A.length, m = Bt.length;

  for (i = n - 1; i >= 0; i--) for (var j = m - 1; j >= 0; j--) L[i][j] = A[i] === Bt[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  var out = '', i2 = 0, j2 = 0;
  while (i2 < n && j2 < m) {
    if (A[i2] === Bt[j2]) { out += esc(A[i2]); i2++; j2++; }
    else if (L[i2 + 1][j2] >= L[i2][j2 + 1]) { out += /^\s+$/.test(A[i2]) ? '' : '<del>' + esc(A[i2]) + '</del>'; i2++; }
    else { out += /^\s+$/.test(Bt[j2]) ? esc(Bt[j2]) : '<ins>' + esc(Bt[j2]) + '</ins>'; j2++; }
  }
  while (i2 < n) { if (!/^\s+$/.test(A[i2])) out += '<del>' + esc(A[i2]) + '</del>'; i2++; }
  while (j2 < m) { out += /^\s+$/.test(Bt[j2]) ? esc(Bt[j2]) : '<ins>' + esc(Bt[j2]) + '</ins>'; j2++; }

/* ---------- লগইন ---------- */
var LG = { email: '' };
function showLogin() {
  $('app').hidden = true; $('login').hidden = false;
  $('lgOrg').textContent = ORG + ' — ' + t('PR & partnerships');
  $('lgL1').textContent = t('Email'); $('lgL2').textContent = t('6-digit code from your email'); $('lgBack').textContent = '← ' + t('Another email');
  lgStep(1);
  if (window.appLockWaitLogin) appLockWaitLogin();
}
function showApp() { $('login').hidden = true; $('app').hidden = false; S._lastBoot = Date.now(); boot(); }
function lgStep(n) {
  $('lgStep1').hidden = n !== 1; $('lgStep2').hidden = n !== 2; $('lgBack').hidden = n !== 2;
  $('lgBtn').textContent = n === 1 ? t('Send code') : t('Log in');
  lgMsg(n === 2 ? t('{0} — the code is in your inbox (check Spam too).', LG.email) : '', true);
  setTimeout(function () { (n === 1 ? $('lgEmail') : $('lgCode')).focus(); }, 30);
}
function lgMsg(m, ok) { var e = $('lgMsg'); e.textContent = m; e.className = 'lg-msg' + (ok ? ' ok' : ''); }
function device() {
  var u = navigator.userAgent;
  var os = /Android/.test(u) ? 'Android' : /iPhone|iPad/.test(u) ? 'iPhone' : /Windows/.test(u) ? 'Windows' : /Mac/.test(u) ? 'Mac' : 'Other';
  var br = /Edg\//.test(u) ? 'Edge' : /Chrome\//.test(u) ? 'Chrome' : /Firefox\//.test(u) ? 'Firefox' : /Safari\//.test(u) ? 'Safari' : 'Browser';
  return os + ' · ' + br;
}
$('lgForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var btn = $('lgBtn'); if (btn.disabled) return;
  var step1 = !$('lgStep1').hidden;
  var done = function () { btn.disabled = false; btn.textContent = step1 ? t('Send code') : t('Log in'); };
  if (step1) {
    var em = $('lgEmail').value.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { lgMsg(t('Enter a valid email address.')); return; }
    btn.disabled = true; btn.textContent = t('Sending…'); lgMsg('');
    callServer('apiSendCode', [em]).then(function () { LG.email = em; done(); lgStep(2); }, function (err) { done(); lgMsg(srvMsg(err.message)); });
  } else {
    var code = $('lgCode').value.replace(/\D/g, '');
    if (code.length !== 6) { lgMsg(t('Enter the 6-digit code.')); return; }
    btn.disabled = true; btn.textContent = t('Checking…'); lgMsg('');
    callServer('apiVerifyCode', [LG.email, code, device()]).then(function (tok) {
      done(); setAuth(tok); $('lgCode').value = ''; showApp(); if (window.appLockAfterLogin) appLockAfterLogin();
    }, function (err) { done(); lgMsg(srvMsg(err.message)); });
  }
});
$('lgBack').addEventListener('click', function () { lgStep(1); });
function logoutLocal() { setAuth(''); S.booted = false; closeOv(); showLogin(); }

/* ---------- শুরু — সব অংশ পড়া শেষে (এর আগে চালালে কোনো পাতার কোড তখনো অজানা থাকে) ---------- */
if (AUTH) showApp(); else showLogin();
</script>
</body>
</html>
